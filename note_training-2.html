<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Detail | AcadBeat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared-nav.css">
    <script src="../shared/acadbeat-local-config.js"></script>
    <link rel="stylesheet" href="acadbeat-global.css">
    <link rel="stylesheet" href="practice-style.css" id="practice-theme-style">
    <style>
        @font-face {
            font-family: 'AcadBeat';
            src:
                local('Pixellari'),
                url('../fonts/Pixellari.ttf') format('truetype'),
                url('../gameUI_src/Assets/Fonts/Pixellari.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-pink: #d6c7c7;
            --card-white: rgba(255, 255, 255, 0.92);
            --text-dark: #3a3a3a;
            --primary: #c9b3b3;
            --secondary: #b9c6b4;
            --accent: #b7c8cc;
            --radius-small: 8px;
            --radius-button: 10px;
            --radius-card: 12px;
            --radius-large: 16px;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.08);
            --transition-fast: all 0.18s ease;
            --space-bg: #433c3d;
            --space-panel: rgba(193, 182, 184, 0.7);
            --space-panel-line: #9ff4e9;
            --space-ink: #ffffff;
            --space-note: #7ef5de;
            --space-shadow: rgba(28, 22, 24, 0.35);
            --pixel-edge: #f2eded;
            --pixel-edge-dark: #7e7374;
        }

        * {
            font-family: 'AcadBeat', sans-serif !important;
            box-sizing: border-box;
        }

        #detailTitle,
        .note-panel-head h3,
        .back-btn.back-fab,
        .btn-small,
        .btn-primary-small,
        .transcript-toggle-btn,
        .note-share-btn,
        .note-dock-toggle-btn,
        #recordAnswerBtn {
            font-family: 'Press Start 2P', 'AcadBeat', monospace !important;
        }

        body[data-page="video-detail"] {
            font-family: 'AcadBeat', sans-serif;
            color: var(--space-ink);
            background:
                radial-gradient(circle at 20% 16%, rgba(255, 255, 255, 0.18) 0 1px, transparent 1.5px),
                radial-gradient(circle at 78% 24%, rgba(255, 255, 255, 0.22) 0 1px, transparent 1.5px),
                radial-gradient(circle at 66% 72%, rgba(255, 255, 255, 0.16) 0 1px, transparent 1.5px),
                radial-gradient(circle at 40% 58%, rgba(255, 255, 255, 0.18) 0 1px, transparent 1.5px),
                linear-gradient(180deg, rgba(67, 60, 61, 0.98), rgba(67, 60, 61, 0.98)),
                url('../owner-background.png') no-repeat center center fixed;
            background-size: 240px 240px, 320px 320px, 360px 360px, 280px 280px, cover, cover;
            min-height: 100vh;
            image-rendering: pixelated;
        }

        body[data-page="video-detail"]::before {
            content: "";
            position: fixed;
            left: -10vw;
            bottom: -18vw;
            width: 46vw;
            height: 46vw;
            min-width: 360px;
            min-height: 360px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.98) 0 7%, rgba(255, 255, 255, 0.9) 7% 18%, transparent 18.5%),
                radial-gradient(circle at 38% 30%, rgba(255, 255, 255, 0.9) 0 20%, rgba(245, 241, 242, 0.9) 20% 44%, rgba(223, 215, 217, 0.88) 44% 66%, rgba(191, 183, 185, 0.84) 66% 82%, rgba(157, 149, 152, 0.82) 82% 100%),
                radial-gradient(ellipse at 60% 34%, rgba(122, 114, 116, 0.22) 0 9%, transparent 9.5%),
                radial-gradient(ellipse at 44% 60%, rgba(130, 122, 124, 0.2) 0 7%, transparent 7.5%),
                radial-gradient(ellipse at 70% 56%, rgba(130, 122, 124, 0.18) 0 6%, transparent 6.5%);
            box-shadow:
                inset -24px -28px 0 rgba(134, 126, 128, 0.38),
                inset 28px 22px 0 rgba(255, 255, 255, 0.08),
                inset 0 0 0 3px rgba(255, 255, 255, 0.1),
                0 30px 60px rgba(0, 0, 0, 0.18);
            opacity: 0.72;
            pointer-events: none;
            z-index: 0;
        }

        body[data-page="video-detail"]::after {
            content: "";
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 11% 22%, rgba(255, 255, 255, 0.28) 0 2px, transparent 2.5px),
                radial-gradient(circle at 16% 28%, rgba(255, 255, 255, 0.22) 0 1.5px, transparent 2px),
                radial-gradient(circle at 88% 18%, rgba(255, 255, 255, 0.22) 0 1.5px, transparent 2px);
            pointer-events: none;
            opacity: 0.7;
            z-index: 0;
        }

        #acadbeatNav,
        .page-shell {
            position: relative;
            z-index: 1;
        }

        .page-shell {
            width: min(1400px, calc(100% - 48px));
        }

        body[data-page="video-detail"] .study-workspace {
            grid-template-columns: minmax(0, 1.42fr) minmax(420px, 0.9fr);
            gap: 28px;
        }

        .page-shell::before {
            content: "";
            position: fixed;
            left: -9vw;
            bottom: 16vw;
            width: 64vw;
            max-width: 800px;
            height: 12.5vw;
            max-height: 138px;
            border-radius: 50%;
            border: 7px solid rgba(201, 191, 193, 0.68);
            border-top-color: rgba(255, 255, 255, 0.24);
            border-bottom-color: rgba(126, 115, 116, 0.32);
            border-left-color: rgba(255, 255, 255, 0.32);
            border-right-color: rgba(126, 115, 116, 0.5);
            background: transparent;
            transform: rotate(-16deg);
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 0 0 2px rgba(255, 255, 255, 0.04),
                0 18px 30px rgba(0, 0, 0, 0.08);
            pointer-events: none;
            z-index: 0;
            opacity: 0.82;
        }

        .page-shell::after {
            content: "";
            position: fixed;
            left: 5vw;
            bottom: 8vw;
            width: 22px;
            height: 62px;
            background:
                radial-gradient(circle at 50% 16%, #fff 0 4px, transparent 4.5px),
                radial-gradient(circle at 50% 42%, #ffd6e7 0 3px, transparent 3.5px),
                linear-gradient(180deg, #111 0 100%);
            border-radius: 10px 10px 6px 6px;
            box-shadow:
                0 0 0 3px #111,
                0 0 0 6px rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 0;
            opacity: 0.9;
        }

        .detail-layout::before {
            content: "";
            position: fixed;
            left: -6vw;
            bottom: 18vw;
            width: 56vw;
            max-width: 700px;
            height: 8vw;
            max-height: 90px;
            border-radius: 50%;
            border: 3px solid rgba(159, 244, 233, 0.16);
            background: transparent;
            transform: rotate(-16deg);
            opacity: 0.75;
            pointer-events: none;
            z-index: 0;
        }

        .detail-layout::after {
            content: "";
            position: fixed;
            left: 4.5vw;
            bottom: 6.2vw;
            width: 64px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(6px);
            pointer-events: none;
            z-index: 0;
        }

        .video-panel,
        .detail-note-panel {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            position: relative;
        }

        .video-panel::before,
        .detail-note-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 0;
            background:
                linear-gradient(180deg, rgba(193, 182, 184, 0.7), rgba(184, 172, 174, 0.68));
            box-shadow:
                0 0 0 3px var(--pixel-edge),
                0 0 0 7px rgba(126, 115, 116, 0.85),
                10px 10px 0 rgba(28, 22, 24, 0.28);
            z-index: -2;
        }

        .video-panel::after,
        .detail-note-panel::after {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 0;
            border: 3px solid var(--space-panel-line);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16);
            opacity: 0.82;
            z-index: -1;
            pointer-events: none;
        }

        .detail-note-panel::after {
            inset: 22px 22px 4px 22px;
        }

        .detail-note-panel {
            padding: 18px !important;
        }

        .workspace-top-actions {
            align-items: center;
            margin-bottom: var(--space-sm);
        }

        .back-btn.back-fab {
            border: 3px solid var(--pixel-edge);
            border-radius: 0;
            background: rgba(193, 182, 184, 0.22);
            color: var(--space-ink);
            box-shadow:
                0 0 0 3px rgba(126, 115, 116, 0.8),
                6px 6px 0 rgba(28, 22, 24, 0.28);
            backdrop-filter: blur(1px);
        }

        .back-btn.back-fab:hover {
            transform: translate(-1px, -1px);
            background: rgba(193, 182, 184, 0.3);
        }

        #detailTitle,
        .note-panel-head h3 {
            color: var(--space-ink);
            font-size: clamp(28px, 3.3vw, 44px);
            line-height: 1.28;
            letter-spacing: 0.01em;
            font-weight: 700;
            text-shadow:
                2px 0 0 rgba(193, 182, 184, 0.48),
                4px 0 0 rgba(126, 115, 116, 0.28);
        }

        #detailTitle {
            margin-bottom: 6px;
        }

        .person-meta-line,
        .detail-meta-row,
        .note-record-feedback,
        .note-record-error {
            color: rgba(255, 255, 255, 0.88);
        }

        .person-meta-line,
        .detail-meta-row {
            opacity: 0.92;
        }

        .detail-meta-row span,
        .detail-meta-row .meta-pill,
        #detailMeta>* {
            background: rgba(255, 255, 255, 0.16);
            color: var(--space-ink);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            box-shadow: none;
        }

        #practiceVideo,
        .transcript-panel {
            border-radius: 0;
            border: 3px solid rgba(255, 255, 255, 0.22);
            box-shadow:
                inset 0 0 0 2px rgba(159, 244, 233, 0.24),
                0 0 0 3px rgba(126, 115, 116, 0.46);
            background: rgba(67, 60, 61, 0.16);
        }

        #practiceVideo {
            background-color: rgba(22, 18, 18, 0.42);
        }

        .detail-resource-tabs {
            margin-top: var(--space-md);
        }

        .btn-small,
        .btn-primary-small,
        .transcript-toggle-btn,
        .note-share-btn,
        .note-dock-toggle-btn,
        #recordAnswerBtn {
            background: linear-gradient(180deg, rgba(218, 204, 205, 0.92), rgba(185, 170, 171, 0.92));
            border: 3px solid var(--pixel-edge);
            border-radius: 0;
            color: var(--text-dark);
            box-shadow:
                0 0 0 3px rgba(126, 115, 116, 0.82),
                5px 5px 0 rgba(28, 22, 24, 0.22);
            transition: var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.7rem;
        }

        .btn-small:hover,
        .btn-primary-small:hover,
        .transcript-toggle-btn:hover,
        .note-share-btn:hover,
        .note-dock-toggle-btn:hover,
        #recordAnswerBtn:hover {
            transform: translate(-1px, -1px);
            filter: brightness(1.03);
        }

        .detail-resource-tab.active,
        .transcript-toggle-btn.active {
            background: var(--accent);
            color: var(--text-dark);
        }

        .transcript-panel {
            background: rgba(255, 255, 255, 0.08);
            color: var(--space-ink);
        }

        .detail-resource-head {
            color: var(--space-note);
            border-bottom-color: rgba(159, 244, 233, 0.35);
        }

        .transcript-content {
            color: rgba(255, 255, 255, 0.92);
        }

        .note-panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            width: calc(100% - 28px);
            margin-left: auto;
            margin-right: auto;
            margin-top: 8px;
            transform: translateX(10px);
        }

        .note-panel-head h3 {
            flex: 1 1 220px;
            min-width: 0;
            margin: 0;
            font-size: clamp(26px, 2.8vw, 38px);
        }

        .note-panel-head-actions {
            flex: 0 1 auto;
            display: flex;
            gap: 5px;
            justify-content: flex-end;
            max-width: 100%;
            align-self: flex-start;
            margin-left: -6px;
            margin-top: 4px;
        }

        .note-share-btn,
        .note-dock-toggle-btn {
            max-width: 100%;
            white-space: nowrap;
            padding-inline: 8px;
            padding-block: 7px;
            font-size: 0.54rem;
        }

        .note-grid.three-col-note-grid {
            gap: 8px;
            width: calc(100% - 44px);
            margin: 22px auto 0;
            transform: none;
            justify-content: center;
        }

        .note-field label {
            color: rgba(255, 255, 255, 0.88);
            display: block;
            margin-bottom: 4px;
            font-size: 0.82rem;
        }

        textarea,
        .note-field-display {
            border-radius: 0;
            border: 3px solid rgba(255, 255, 255, 0.22);
            box-shadow:
                inset 0 0 0 2px rgba(159, 244, 233, 0.24),
                0 0 0 3px rgba(126, 115, 116, 0.46);
            background: rgba(67, 60, 61, 0.16);
            color: var(--space-ink);
        }

        textarea {
            min-height: 232px;
            padding: 8px;
            font-size: 0.84rem;
            line-height: 1.45;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        textarea:focus {
            outline: none;
            border-color: var(--space-panel-line);
            box-shadow:
                inset 0 0 0 2px rgba(159, 244, 233, 0.24),
                0 0 0 3px rgba(126, 115, 116, 0.46),
                0 0 0 6px rgba(159, 244, 233, 0.1);
        }

        .note-field-display {
            padding: 8px;
            margin-top: 4px;
            min-height: 72px;
            font-size: 0.82rem;
        }

        .note-record-action {
            margin-top: 10px;
            width: calc(100% - 44px);
            margin-left: auto;
            margin-right: auto;
            transform: none;
        }

        .note-record-action-row {
            align-items: center;
            gap: 6px;
        }

        #recordAnswerBtn {
            font-size: 0.58rem;
            padding: 8px 10px;
        }

        .note-record-error {
            font-size: 0.8rem;
        }

        .note-record-feedback {
            padding: 10px 12px;
            font-size: 0.82rem;
        }

        .note-record-feedback {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(159, 244, 233, 0.35);
            border-radius: 0;
            padding: 14px 16px;
            box-shadow: 0 0 0 2px rgba(126, 115, 116, 0.4);
        }

        .note-record-feedback strong {
            color: var(--space-note);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 6px;
        }

        @media (max-width: 980px) {
            body[data-page="video-detail"]::before {
                width: 62vw;
                height: 62vw;
            }

            .page-shell::before,
            .page-shell::after,
            .detail-layout::before,
            .detail-layout::after {
                display: none;
            }

            #detailTitle,
            .note-panel-head h3 {
                font-size: clamp(24px, 7vw, 42px);
            }
        }

        /* 只放大右侧字体 + 缩小文本框 - 粘贴在 style 最后即可 */
        .note-panel-head h3 {
            font-size: clamp(30px, 3.2vw, 44px) !important;
        }

        .note-field label {
            font-size: 1.1rem !important;
        }

        .note-share-btn,
        .note-dock-toggle-btn,
        #recordAnswerBtn {
            font-size: 0.7rem !important;
        }

        .note-record-error,
        .note-record-feedback {
            font-size: 0.95rem !important;
        }

        textarea,
        .note-field-display {
            min-height: 70px !important;
            height: 70px !important;
            padding: 6px !important;
            font-size: 0.9rem !important;
        }

        /* 右侧整个笔记面板整体缩小一点 */
        .detail-note-panel {
            transform: scale(0.92);
            transform-origin: top right;
        }

        /* 文本框高度不变，只变窄 */
        .note-grid.three-col-note-grid {
            gap: 4px !important;
        }

        .note-field textarea {
            width: 92% !important;
            min-height: 112px !important;
            /* 高度保持原样 */
        }

        /* 居中不变 + 宽度不变 + 高度稍微缩小 */
        .note-grid.three-col-note-grid {
            width: 100% !important;
            max-width: 100% !important;
            margin: 22px auto 0 !important;
            justify-content: center !important;
            padding: 0 14px !important;
            gap: 12px !important;
        }

        .note-field {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
        }

        .note-field textarea {
            width: 94% !important;
            min-height: 150px !important;
            height: 150px !important;
            margin: 0 auto !important;
        }

        .detail-note-panel {
            transform: none !important;
        }
    </style>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const uiMode = params.get('ui');
            if (uiMode !== 'godot') return;
            document.cookie = 'ui_mode=godot; path=/; max-age=2592000';
            const link = document.getElementById('practice-theme-style');
            if (link) link.href = '../newUI/static/practice-detail-pixel.css';
        })();
    </script>
</head>

<body data-page="video-detail">
    <div id="acadbeatNav"></div>
    <main class="module-content page-shell" style="padding-top: 110px;">
        <div id="studyWorkspace" class="study-workspace">
            <section class="detail-layout">
                <div class="video-panel">
                    <div class="workspace-top-actions">
                        <button class="back-btn back-fab" data-back-target="listening.html" aria-label="Go back"
                            title="Back" type="button">&#8592;</button>
                        <h2 id="detailTitle">Video title</h2>
                    </div>
                    <p id="detailPersonMeta" class="person-meta-line"></p>
                    <div id="detailMeta" class="detail-meta-row"></div>
                    <video id="practiceVideo" controls preload="metadata"></video>
                    <div class="detail-resource-tabs">
                        <button class="btn-small transcript-toggle-btn detail-resource-tab" id="transcriptToggleBtn"
                            type="button">Transcript</button>
                        <button class="btn-small transcript-toggle-btn detail-resource-tab hidden"
                            id="sampleNotesToggleBtn" type="button">Sample Notes</button>
                    </div>
                    <aside class="transcript-panel hidden" id="transcriptPanel">
                        <div class="detail-resource-head">
                            <strong id="detailResourceTitle">Transcript</strong>
                        </div>
                        <div class="transcript-content" id="transcriptContent"></div>
                    </aside>
                </div>
            </section>

            <section class="detail-note-layout">
                <aside class="note-panel detail-note-panel">
                    <div class="note-panel-head">
                        <h3>Note</h3>
                        <div class="note-panel-head-actions">
                            <button class="btn-small note-share-btn" id="noteShareBtn" type="button">Share</button>
                            <button class="btn-small note-dock-toggle-btn" id="noteDockToggleBtn"
                                type="button">Fold</button>
                        </div>
                    </div>
                    <div class="note-grid three-col-note-grid">
                        <div class="note-field">
                            <label for="noteMainContent">Main Content</label>
                            <textarea id="noteMainContent" rows="6"
                                placeholder="Summarize the main content of the video"></textarea>
                            <div class="note-field-display hidden" id="noteMainContentDisplay"></div>
                        </div>
                        <div class="note-field">
                            <label for="noteKeyWord">Key Word</label>
                            <textarea id="noteKeyWord" rows="6" placeholder="Record keywords and terms"></textarea>
                            <div class="note-field-display hidden" id="noteKeyWordDisplay"></div>
                        </div>
                        <div class="note-field">
                            <label for="notePersonalView">Personal View</label>
                            <textarea id="notePersonalView" rows="6"
                                placeholder="Write your thoughts and opinions"></textarea>
                            <div class="note-field-display hidden" id="notePersonalViewDisplay"></div>
                        </div>
                    </div>
                    <div class="note-record-action">
                        <div class="note-record-action-row">
                            <button class="btn-small btn-primary-small" id="recordAnswerBtn" type="button">Record your
                                answer</button>
                            <span class="note-record-error hidden" id="recordAnswerError">notes are blank</span>
                        </div>
                        <div class="note-record-feedback hidden" id="recordAnswerFeedback">
                            <strong>Saved to your study record</strong>
                            <span>You can still make multiple attempts and save</span>
                        </div>
                    </div>
                </aside>
            </section>
        </div>
    </main>

    <script src="practice-data.js"></script>
    <script src="practice-data-api.js"></script>
    <script src="practice-app-api.js"></script>
    <script>
        window.addEventListener('load', () => {
            const uiGodot = (() => {
                try {
                    return new URLSearchParams(location.search).get('ui') === 'godot';
                } catch (_e) { }
                return false;
            })();
            const L = window.ACADBEAT_LOCAL || {};
            const loginUrl = uiGodot ? (L.godotWebEntryUrl || 'http://127.0.0.1:5500/index.html?ui=godot') : '../home.html?login=1';
            window.initializeAcadBeatNav({
                mountId: 'acadbeatNav',
                basePath: '../',
                active: 'academic',
                authApiBase: '../Auth/backend/api',
                homeUrl: '../home.html',
                ownerUrl: '../owner.html',
                adminUrl: L.adminDistUrl || window.location.origin + '/admin_page/dist/index.html',
                loginUrl,
                redirectAdmins: false
            });
        });
    </script>
    <script src="../shared-nav.js"></script>
</body>

</html>
