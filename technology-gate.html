<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technology</title>
  <link rel="stylesheet" href="./shared-nav.css">
  <link rel="stylesheet" href="./shared-gate.css">
  <script src="./shared/acadbeat-local-config.js"></script>
  <style>
    /* Technology-only: rising scan lines + soft glow orbs */
    .gate-fx--technology .tech-lines {
      position: absolute;
      inset: -8%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 36px,
        rgba(91, 42, 134, 0.055) 36px,
        rgba(91, 42, 134, 0.055) 37px
      );
      animation: gateTechLines 11s linear infinite;
      opacity: 0.85;
    }
    .gate-fx--technology .tech-orb {
      position: absolute;
      width: 42vmin;
      height: 42vmin;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.45;
      pointer-events: none;
    }
    .gate-fx--technology .tech-orb.o1 {
      left: -8%;
      top: 20%;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.35), transparent 70%);
      animation: gateTechOrbFloat 9s ease-in-out infinite;
    }
    .gate-fx--technology .tech-orb.o2 {
      right: -6%;
      bottom: 12%;
      background: radial-gradient(circle, rgba(91, 42, 134, 0.32), transparent 70%);
      animation: gateTechOrbFloat 12s ease-in-out infinite reverse;
    }
    @keyframes gateTechLines {
      from { transform: translateY(0); }
      to { transform: translateY(37px); }
    }
    @keyframes gateTechOrbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4vw, -2vh) scale(1.08); }
    }
  </style>
</head>
<body class="gate-page">
  <div id="acadbeatNav"></div>
  <a class="gate-home-link" href="./home.html?entry=1" title="Back to AcadBeat home">AcadBeat Home</a>
  <main class="gate-main gate-main--clickable" onclick="enterPage()" onkeydown="enterByKey(event)" tabindex="0">
    <div class="gate-fx gate-fx--technology" aria-hidden="true">
      <div class="tech-lines"></div>
      <div class="tech-orb o1"></div>
      <div class="tech-orb o2"></div>
    </div>
    <div class="gate-hero">
      <h1 class="gate-title">Technology</h1>
      <div class="gate-typing" aria-hidden="true">
        <div class="gate-typing-track">
          <span id="gateTypingDot" class="gate-typing-dot">🫀</span>
          <span id="gateTypingText"></span>
        </div>
      </div>
      <div class="gate-actions">
        <button type="button" class="gate-enter-btn" onclick="enterPage(); event.stopPropagation();">Enter Module</button>
      </div>
    </div>
  </main>
  <script src="./shared-nav.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: './',
        active: 'technology',
        academicUrl: './academic-gate.html',
        forumUrl: './forum-gate.html',
        technologyUrl: './technology-gate.html',
        studioUrl: './studio-gate.html',
        competitionUrl: './competition-gate.html',
        authApiBase: './Auth/backend/api',
        homeUrl: './home.html',
        ownerUrl: './owner.html',
        adminUrl: (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || window.location.origin + '/admin_page/dist/index.html',
        redirectAdmins: true
      });
      initGateTyping();
    });
    function initGateTyping() {
      const phrase = 'Acquire necessary skills and learn to use practical tools.';
      const textMount = document.getElementById('gateTypingText');
      const dot = document.getElementById('gateTypingDot');
      if (!textMount || !dot) return;
      textMount.innerHTML = '';
      const chars = Array.from(phrase).map((ch) => {
        const span = document.createElement('span');
        span.className = 'gate-typing-char';
        span.textContent = ch;
        textMount.appendChild(span);
        return span;
      });
      function setDot(index) {
        if (!chars.length) return;
        const safe = Math.max(0, Math.min(index, chars.length - 1));
        dot.style.left = `${chars[safe].offsetLeft - 16}px`;
      }
      function clearLine() {
        chars.forEach((el) => el.classList.remove('is-on'));
        dot.style.left = '0px';
      }
      function loop() {
        clearLine();
        let i = 0;
        const timer = window.setInterval(() => {
          if (i < chars.length) {
            chars[i].classList.add('is-on');
            setDot(i);
            i += 1;
            return;
          }
          window.clearInterval(timer);
          window.setTimeout(loop, 1000);
        }, 65);
      }
      loop();
    }
    function enterPage() { window.location.href = './Technology/technology.html'; }
    function enterByKey(event) {
      if (event.key === 'Enter' || event.key === ' ') enterPage();
    }
  </script>
</body>
</html>
