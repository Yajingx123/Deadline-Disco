<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Selection | AcadBeat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared-nav.css">
  <script src="../shared/acadbeat-local-config.js"></script>
  <link rel="stylesheet" href="acadbeat-global.css">
  <link rel="stylesheet" href="practice-style.css">
  <style>
    @font-face {
      font-family: 'AcadBeat';
      src:
        local('Pixellari'),
        url('../fonts/Pixellari.ttf') format('truetype'),
        url('../gameUI_src/Assets/Fonts/Pixellari.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-pink: #d6c7c7;
      --card-white: rgba(255, 255, 255, 0.92);
      --text-dark: #3a3a3a;
      --primary: #c9b3b3;
      --secondary: #b9c6b4;
      --accent: #b7c8cc;
      --radius-small: 8px;
      --radius-button: 10px;
      --radius-card: 12px;
      --radius-large: 16px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.08);
      --transition-fast: all 0.18s ease;
      --space-bg: #433c3d;
      --space-panel: rgba(193, 182, 184, 0.58);
      --space-panel-line: #9ff4e9;
      --space-ink: #ffffff;
      --space-note: #7ef5de;
      --space-shadow: rgba(28, 22, 24, 0.35);
      --pixel-edge: #f2eded;
      --pixel-edge-dark: #7e7374;
    }

    * {
      font-family: 'AcadBeat', sans-serif !important;
      box-sizing: border-box;
    }

    #modeTitle,
    #resultsCount,
    .back-btn.back-fab,
    .btn-small,
    .listening-filter-reset-btn,
    .listening-caption,
    .listening-filter-slot[data-filter]::before,
    .listening-filter-slot--country::before {
      font-family: 'Press Start 2P', 'AcadBeat', monospace !important;
    }

    body[data-page="video-list"] {
      font-family: 'AcadBeat', sans-serif;
      color: var(--space-ink);
      background:
        radial-gradient(circle at 20% 16%, rgba(255,255,255,0.18) 0 1px, transparent 1.5px),
        radial-gradient(circle at 78% 24%, rgba(255,255,255,0.22) 0 1px, transparent 1.5px),
        radial-gradient(circle at 66% 72%, rgba(255,255,255,0.16) 0 1px, transparent 1.5px),
        radial-gradient(circle at 40% 58%, rgba(255,255,255,0.18) 0 1px, transparent 1.5px),
        linear-gradient(180deg, rgba(67,60,61,0.98), rgba(67,60,61,0.98)),
        url('../owner-background.png') no-repeat center center fixed;
      background-size: 240px 240px, 320px 320px, 360px 360px, 280px 280px, cover, cover;
      image-rendering: pixelated;
    }

    body[data-page="video-list"]::before {
      content: "";
      position: fixed;
      left: -10vw;
      bottom: -18vw;
      width: 46vw;
      height: 46vw;
      min-width: 360px;
      min-height: 360px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,0.98) 0 7%, rgba(255,255,255,0.9) 7% 18%, transparent 18.5%),
        radial-gradient(circle at 38% 30%, rgba(255,255,255,0.9) 0 20%, rgba(245,241,242,0.9) 20% 44%, rgba(223,215,217,0.88) 44% 66%, rgba(191,183,185,0.84) 66% 82%, rgba(157,149,152,0.82) 82% 100%),
        radial-gradient(ellipse at 60% 34%, rgba(122,114,116,0.22) 0 9%, transparent 9.5%),
        radial-gradient(ellipse at 44% 60%, rgba(130,122,124,0.2) 0 7%, transparent 7.5%),
        radial-gradient(ellipse at 70% 56%, rgba(130,122,124,0.18) 0 6%, transparent 6.5%),
        radial-gradient(ellipse at 28% 70%, rgba(255,255,255,0.14) 0 5%, transparent 5.5%),
        radial-gradient(ellipse at 58% 76%, rgba(255,255,255,0.12) 0 4%, transparent 4.5%);
      box-shadow:
        inset -24px -28px 0 rgba(134, 126, 128, 0.38),
        inset 28px 22px 0 rgba(255,255,255,0.08),
        inset 0 0 0 3px rgba(255,255,255,0.1),
        0 30px 60px rgba(0,0,0,0.18);
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
    }

    body[data-page="video-list"]::after {
      content: "";
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 11% 22%, rgba(255,255,255,0.28) 0 2px, transparent 2.5px),
        radial-gradient(circle at 16% 28%, rgba(255,255,255,0.22) 0 1.5px, transparent 2px),
        radial-gradient(circle at 88% 18%, rgba(255,255,255,0.22) 0 1.5px, transparent 2px);
      pointer-events: none;
      opacity: 0.42;
      z-index: 0;
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1400px, calc(100% - 48px));
    }

    .page-shell::before {
      content: "";
      position: fixed;
      left: -8vw;
      bottom: 12vw;
      width: 50vw;
      max-width: 640px;
      height: 9vw;
      max-height: 96px;
      border-radius: 50%;
      border: 5px solid rgba(201, 191, 193, 0.44);
      border-top-color: rgba(255,255,255,0.24);
      border-bottom-color: rgba(126, 115, 116, 0.32);
      border-left-color: rgba(255,255,255,0.32);
      border-right-color: rgba(126, 115, 116, 0.5);
      background: transparent;
      transform: rotate(-16deg);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      pointer-events: none;
      z-index: 0;
      opacity: 0.34;
    }

    .page-shell::after {
      content: none;
    }

    .listening-layout-root::before {
      content: none;
    }

    .listening-layout-root::after {
      content: none;
    }

    .listening-art--mascot,
    .listening-texture-cell,
    .listening-art--power,
    .listening-art--led {
      image-rendering: pixelated;
    }

    #acadbeatNav {
      position: relative;
      z-index: 2;
    }

    .listening-caption {
      margin-top: var(--space-sm);
      color: var(--space-note);
      opacity: 0.82;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.5;
      text-shadow: none;
      font-size: 0.56rem;
    }

    .listening-slot--mascot,
    .listening-right-rail,
    .listening-frame-outer,
    .listening-filter-dock-frame,
    .listening-row-top.compact-results-header {
      position: relative;
    }

    .listening-art--mascot,
    .listening-texture-cell,
    .listening-filter-dock,
    .listening-row-top.compact-results-header,
    .results-scroll-region,
    .listening-tv-screen {
      background:
        linear-gradient(180deg, rgba(193, 182, 184, 0.7), rgba(184, 172, 174, 0.68));
      border: 3px solid var(--pixel-edge);
      border-radius: 0;
      box-shadow:
        0 0 0 4px rgba(126, 115, 116, 0.62),
        6px 6px 0 rgba(28, 22, 24, 0.14);
    }

    .listening-row-top.compact-results-header {
      background:
        linear-gradient(180deg, rgba(193, 182, 184, 0.76), rgba(184, 172, 174, 0.74));
    }

    #modeTitle {
      color: var(--space-ink);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.35;
      font-size: clamp(20px, 2.2vw, 32px);
      text-shadow:
        2px 0 0 rgba(193, 182, 184, 0.28);
    }

    #resultsCount {
      color: rgba(255,255,255,0.86);
      letter-spacing: 0.02em;
      font-size: 0.64rem;
      line-height: 1.5;
    }

    .back-btn.back-fab,
    .btn-small,
    .listening-filter-reset-btn {
      background: linear-gradient(180deg, rgba(218, 204, 205, 0.92), rgba(185, 170, 171, 0.92));
      border: 3px solid var(--pixel-edge);
      border-radius: 0;
      color: var(--text-dark);
      transition: var(--transition-fast);
      box-shadow:
        0 0 0 3px rgba(126, 115, 116, 0.82),
        5px 5px 0 rgba(28, 22, 24, 0.22);
      text-transform: uppercase;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.5);
      letter-spacing: 0.03em;
      font-size: 0.62rem;
    }

    .back-btn.back-fab:hover,
    .btn-small:hover,
    .listening-filter-reset-btn:hover {
      transform: translate(-1px, -1px);
      filter: brightness(1.02);
    }

    .back-btn.back-fab:active,
    .btn-small:active,
    .listening-filter-reset-btn:active {
      transform: translate(1px, 1px);
      box-shadow:
        0 0 0 3px rgba(126, 115, 116, 0.82),
        2px 2px 0 rgba(28, 22, 24, 0.18);
    }

    .listening-tv-screen,
    .results-scroll-region {
      background:
        linear-gradient(180deg, rgba(67,60,61,0.18), rgba(67,60,61,0.12));
    }

    .listening-tv-screen {
      position: relative;
      overflow: hidden;
    }

    .listening-tv-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(transparent 50%, rgba(255,255,255,0.04) 50%);
      background-size: 100% 4px;
      opacity: 0.18;
      z-index: 1;
    }

    .listening-tv-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.18), transparent 45%);
      z-index: 1;
    }

    .results-scroll-region {
      box-shadow:
        inset 0 0 0 2px rgba(159, 244, 233, 0.24),
        0 0 0 2px rgba(126, 115, 116, 0.36);
    }

    .results-scroll-region::before {
      content: none;
    }

    .video-card,
    .video-result-card,
    .practice-card,
    .result-card,
    .compact-video-card,
    .video-item {
      background:
        linear-gradient(180deg, rgba(193, 182, 184, 0.52), rgba(184, 172, 174, 0.48));
      border-radius: 0;
      box-shadow:
        0 0 0 2px rgba(242, 237, 237, 0.32),
        0 0 0 4px rgba(126, 115, 116, 0.36);
      border: 1px solid rgba(159, 244, 233, 0.12);
    }

    .smart-input,
    .smart-select,
    .compact-search,
    .compact-select,
    .country-filter {
      width: 100%;
      border: 2px solid var(--pixel-edge);
      border-radius: 0;
      padding: var(--space-sm) var(--space-md);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.08));
      color: var(--space-ink);
      box-shadow:
        0 0 0 2px rgba(126, 115, 116, 0.34);
      appearance: none;
    }

    .smart-input::placeholder {
      color: rgba(255,255,255,0.58);
    }

    .smart-input:focus,
    .smart-select:focus,
    .compact-search:focus,
    .compact-select:focus {
      outline: none;
      border-color: var(--space-panel-line);
      box-shadow:
        0 0 0 2px rgba(126, 115, 116, 0.34),
        0 0 0 5px rgba(159, 244, 233, 0.1);
    }

    .listening-filter-dock {
      background:
        linear-gradient(180deg, rgba(193, 182, 184, 0.7), rgba(184, 172, 174, 0.68));
      position: relative;
      overflow: hidden;
    }

    .listening-filter-dock::before {
      content: "CONTROL";
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: rgba(255,255,255,0.34);
      pointer-events: none;
    }

    .listening-filter-slot,
    .listening-filter-slot--country,
    .listening-filter-reset-square {
      background: transparent;
    }

    .listening-art--led {
      background: var(--space-note);
      box-shadow:
        0 0 0 2px rgba(95, 86, 86, 0.22),
        0 0 12px rgba(126,245,222,0.35);
    }

    .listening-art--power {
      background: rgba(255,255,255,0.18);
      box-shadow:
        0 0 0 2px rgba(95, 86, 86, 0.2);
    }

    .listening-texture-cell {
      border-radius: 0;
      background:
        linear-gradient(180deg, rgba(193, 182, 184, 0.18), rgba(184, 172, 174, 0.14));
      opacity: 0.65;
    }

    .video-card-list > *:hover {
      filter: brightness(1.04);
      transform: translate(-1px, -1px);
      transition: var(--transition-fast);
    }

    .listening-tv-body,
    .listening-frame-inner,
    .listening-frame-outer {
      filter: drop-shadow(0 10px 16px rgba(28, 22, 24, 0.2));
    }

    .listening-filter-slot[data-filter]::before {
      font-size: 0.48rem;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.72);
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .listening-filter-slot[data-filter="search"]::before { content: "SEARCH"; }
    .listening-filter-slot[data-filter="type"]::before { content: "TYPE"; }
    .listening-filter-slot[data-filter="difficulty"]::before { content: "LEVEL"; }
    .listening-filter-slot[data-filter="duration"]::before { content: "TIME"; }
    .listening-filter-slot[data-filter="source"]::before { content: "SOURCE"; }
    .listening-filter-slot--country::before {
      content: "COUNTRY";
      font-size: 0.48rem;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.72);
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .listening-filter-dock,
    .listening-tv-screen,
    .video-card,
    .video-result-card,
    .practice-card,
    .result-card,
    .compact-video-card,
    .video-item,
    .smart-input,
    .smart-select,
    .compact-search,
    .compact-select,
    .country-filter {
      color: var(--space-ink);
    }

    .listening-godot-viewport,
    .listening-right-rail,
    .listening-slot--mascot {
      filter: drop-shadow(0 8px 14px rgba(28, 22, 24, 0.12));
    }

    img {
      image-rendering: pixelated;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 6px;
    }

    @media (max-width: 980px) {
      body[data-page="video-list"]::before {
        width: 62vw;
        height: 62vw;
      }

      .page-shell::before,
      .page-shell::after,
      .listening-layout-root::before,
      .listening-layout-root::after {
        display: none;
      }
    }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var uiParam = params.get('ui');
      var cookieGodot = document.cookie.split('; ').some(function (c) {
        return c === 'ui_mode=godot' || c.indexOf('ui_mode=godot') === 0;
      });
      if (uiParam !== 'godot' && cookieGodot) {
        params.set('ui', 'godot');
        var qs = params.toString();
        history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
        uiParam = 'godot';
      }
      if (uiParam !== 'godot') {
        return;
      }
      /* 先于首帧：让 practice-style 的 display:contents 拆层不作用于 Godot（与 game-listening-theme 同特异性时不再靠加载顺序赌赢） */
      document.documentElement.setAttribute('data-ui', 'godot');
      document.cookie = 'ui_mode=godot; path=/; max-age=2592000';
      var font = document.createElement('link');
      font.rel = 'stylesheet';
      font.href = 'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap';
      document.head.appendChild(font);
      var theme = document.createElement('link');
      theme.rel = 'stylesheet';
      theme.href = '../newUI/static/game-listening-theme.css';
      document.head.appendChild(theme);
    })();
  </script>
</head>
<body data-page="video-list">
  <script>
    (function () {
      try {
        var m = new URLSearchParams(window.location.search).get("mode");
        var lm = m === "respond" ? "respond" : "understand";
        document.documentElement.dataset.listeningMode = lm;
        document.body.dataset.listeningMode = lm;
      } catch (_e) {}
    })();
  </script>
  <div id="acadbeatNav"></div>
  <main class="module-content page-shell">
    <section class="video-results compact-results">
      <div class="listening-layout-root">
        <div class="listening-below-header">
          <div class="listening-row-godot-main">
            <aside class="listening-slot listening-slot--mascot" aria-hidden="true">
              <div class="listening-art listening-art--mascot" data-ab-art="mascot"></div>
              <p class="listening-caption">choose your video</p>
            </aside>

            <div class="listening-godot-viewport">
            <div class="listening-godot-canvas">

              <div class="listening-slot listening-slot--exit">
                <button class="back-btn back-fab" data-back-target="training.html" aria-label="Go back" title="Back" type="button">&#8592;</button>
              </div>

                <h3 id="modeTitle">Self-training</h3>

            <div class="listening-main-stage">
              <div class="listening-center-area">
                <div class="listening-center-wrap">
                <div class="listening-square-stage">
                <div class="listening-frame-outer">
                  <div class="listening-frame-inner">
                    <div class="listening-tv-stack">
                      <div class="listening-tv-body">
                        <div class="listening-tv-screen">
                          <div class="results-scroll-region">
                            <div id="videoResultList" class="video-card-list"></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                </div>
                </div>
              </div>
              <div class="listening-right-rail">
                  <div class="listening-texture-cluster" aria-hidden="true">
                    <div class="listening-texture-cell" data-ab-art="tx-01"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-02"></div>
                    <div class="listening-texture-cell listening-texture-cell--wide" data-ab-art="tx-03"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-04"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-05"></div>
                    <div class="listening-texture-cell listening-texture-cell--tall" data-ab-art="tx-06"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-07"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-08"></div>
                    <div class="listening-texture-cell listening-texture-cell--wide" data-ab-art="tx-09"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-10"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-11"></div>
                    <div class="listening-texture-cell listening-texture-cell--small" data-ab-art="tx-12"></div>
                  </div>
                  <aside class="listening-filter-dock" aria-label="Filters">

                        <div class="listening-filter-dock-leds">
                          <div class="listening-art listening-art--led" data-ab-art="dock-led-1"></div>

                            </select>
                          </div>

                      </div>
                      <div class="listening-filter-reset-square">
                        <button id="clearSmartFilters" class="btn-small compact-reset-btn listening-filter-reset-btn" type="button">Reset</button>

            </div>
            </div>
            </div>
            </div>
          </div>
        </div>

    </section>
  </main>

  <script>
    window.addEventListener('load', () => {
      const uiGodot = (() => {
        try {
          if (new URLSearchParams(location.search).get('ui') === 'godot') return true;
        } catch (_e) {}
        return document.cookie.split('; ').some((c) => c.startsWith('ui_mode=godot'));
      })();
