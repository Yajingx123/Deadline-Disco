<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic</title>
  <link rel="stylesheet" href="./shared-nav.css">
  <link rel="stylesheet" href="./shared-gate.css">
  <script src="./shared/acadbeat-local-config.js"></script>
  <style>
    /* Academic-only: drifting grid + light sweep */
    .gate-fx--academic .academic-grid {
      position: absolute;
      inset: -12vh -8vw;
      background:
        linear-gradient(rgba(91, 42, 134, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 42, 134, 0.08) 1px, transparent 1px);
      background-size: 46px 46px;
      animation: gateAcademicDrift 14s ease-in-out infinite alternate;
    }
    .gate-fx--academic .academic-scan {
      position: absolute;
      top: -18%;
      left: -42%;
      width: 40%;
      height: 150%;
      transform: skewX(-14deg);
      background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.24), transparent);
      animation: gateAcademicSweep 5s ease-in-out infinite;
    }
    @keyframes gateAcademicDrift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(3vw, -2vh, 0) scale(1.06); }
    }
    @keyframes gateAcademicSweep {
      0% { left: -45%; }
      56% { left: 120%; }
      100% { left: 120%; }
    }
  </style>
</head>
<body class="gate-page">
  <div id="acadbeatNav"></div>
  <a class="gate-home-link" href="./home.html?entry=1" title="Back to AcadBeat home">AcadBeat Home</a>
  <main class="gate-main gate-main--clickable" onclick="enterPage()" onkeydown="enterByKey(event)" tabindex="0">
    <div class="gate-fx gate-fx--academic" aria-hidden="true">
      <div class="academic-grid"></div>
      <div class="academic-scan"></div>
    </div>
    <div class="gate-hero">
      <h1 class="gate-title">Academic</h1>
      <div class="gate-typing" aria-hidden="true">
        <div class="gate-typing-track">
          <span id="gateTypingDot" class="gate-typing-dot">🫀</span>
          <span id="gateTypingText"></span>
        </div>
      </div>
      <div class="gate-actions">
        <button type="button" class="gate-enter-btn" onclick="enterPage(); event.stopPropagation();">Enter Module</button>
      </div>
    </div>
  </main>
  <script src="./shared-nav.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: './',
        active: 'academic',
        showSwitchButton: false,
        academicUrl: './academic-gate.html',
        forumUrl: './forum-gate.html',
        technologyUrl: './technology-gate.html',
        studioUrl: './studio-gate.html',
        competitionUrl: './competition-gate.html',
        authApiBase: './Auth/backend/api',
        homeUrl: './home.html',
        ownerUrl: './owner.html',
        adminUrl: (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || window.location.origin + '/admin_page/dist/index.html',
        redirectAdmins: true
      });
      initGateTyping();
    });
    function initGateTyping() {
      const phrase = 'Strengthen your core academic English fundamentals.';
      const textMount = document.getElementById('gateTypingText');
      const dot = document.getElementById('gateTypingDot');
      if (!textMount || !dot) return;
      textMount.innerHTML = '';
      const chars = Array.from(phrase).map((ch) => {
        const span = document.createElement('span');
        span.className = 'gate-typing-char';
        span.textContent = ch;
        textMount.appendChild(span);
        return span;
      });
      function setDot(index) {
        if (!chars.length) return;
        const safe = Math.max(0, Math.min(index, chars.length - 1));
        dot.style.left = `${chars[safe].offsetLeft - 16}px`;
      }
      function clearLine() {
        chars.forEach((el) => el.classList.remove('is-on'));
        dot.style.left = '0px';
      }
      function loop() {
        clearLine();
        let i = 0;
        const timer = window.setInterval(() => {
          if (i < chars.length) {
            chars[i].classList.add('is-on');
            setDot(i);
            i += 1;
            return;
          }
          window.clearInterval(timer);
          window.setTimeout(loop, 1000);
        }, 65);
      }
      loop();
    }
    function enterPage() { window.location.href = './Academic-Practice/training.html'; }
    function enterByKey(event) { if (event.key === 'Enter' || event.key === ' ') enterPage(); }
  </script>
</body>
</html>
