<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Center</title>
    <link rel="stylesheet" href="/shared-nav.css" />
    <script src="/shared/acadbeat-local-config.js"></script>
    <style>html.acadbeat-role-guard body{visibility:hidden}</style>
    <style>
      html, body {
        min-height: 100%;
      }
      body.mc2-godot-bg {
        background-color: #e4dfd8;
        background-image: url('/message-center-project%202/background.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
      }
      body.mc2-godot-bg .mc2-topbar__backBtn {
        display: none !important;
      }
      .godot-back-btn {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1200;
        border: 1px solid rgba(58, 78, 107, 0.2);
        background: rgba(255, 255, 255, 0.94);
        color: #1e293b;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(58, 78, 107, 0.14);
      }
      .godot-back-btn[hidden] { display: none; }
    </style>
    <script>
      document.documentElement.classList.add('acadbeat-role-guard');
      (async function guardAdminMessageCenter() {
        try {
          const me = (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.authMeUrl) || `${window.location.origin}/Auth/backend/api/me.php`;
          const response = await fetch(me, { credentials: 'include' });
          const data = await response.json().catch(() => ({ status: 'error' }));
          if (data.status === 'success' && data.user && String(data.user.role || '').toLowerCase() === 'admin') {
            const admin = (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || `${window.location.origin}/admin_page/dist/index.html`;
            window.location.replace(admin);
            return;
          }
        } catch (_err) {}
        document.documentElement.classList.remove('acadbeat-role-guard');
      })();
    </script>
  </head>
  <body>
    <button id="godotBackBtn" class="godot-back-btn" type="button" hidden>← Return to Godot</button>
    <div id="acadbeatNav"></div>
    <div id="root"></div>
    <script src="/shared-nav.js"></script>
    <script>
      (function initMessageCenterSharedNav() {
        var L = window.ACADBEAT_LOCAL || {};
        var MAIN = L.mainOrigin || window.location.origin;
        var params = new URLSearchParams(window.location.search);
        var isGodot = params.get('ui') === 'godot';
        var navMount = document.getElementById('acadbeatNav');
        if (isGodot) {
          if (navMount) navMount.style.display = 'none';
          return;
        }
        function boot() {
          if (typeof window.initializeAcadBeatNav !== 'function') return;
          window.initializeAcadBeatNav({
            mountId: 'acadbeatNav',
            basePath: MAIN + '/',
            homeUrl: MAIN + '/home.html',
            ownerUrl: MAIN + '/owner.html',
            authApiBase: MAIN + '/Auth/backend/api',
            forumUrl: MAIN + '/home.html?module=Dialogue',
            technologyUrl: MAIN + '/technology.html',
            studioUrl: MAIN + '/Studio/studio.html',
            messageCenterUrl: L.messageCenterDistUrl,
            adminUrl: L.adminDistUrl,
            messageApiUrl: L.messageSummaryApiUrl,
            loginUrl: MAIN + '/home.html?login=1',
            active: 'messages',
            redirectAdmins: true,
            showChallengeButton: false,
          });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function initGodotBackButton() {
        var btn = document.getElementById('godotBackBtn');
        if (!btn) return;
        var params = new URLSearchParams(window.location.search);
        var isGodot = params.get('ui') === 'godot';
        if (!isGodot) return;
        document.body.classList.add('mc2-godot-bg');
        var L = window.ACADBEAT_LOCAL || {};
        var target = String(L.godotWebEntryUrl || '').trim() || (window.location.origin + '/gameUI_src/Release/index.html?ui=godot');
        btn.hidden = false;
        btn.addEventListener('click', function () {
          window.location.href = target;
        });
      })();
    </script>
  </body>
</html>
