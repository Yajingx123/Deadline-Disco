<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcadBeat | Resonance in Learning</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,700&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./shared-nav.css">
    <link rel="stylesheet" href="./challenge/challenge-home.css">
    <script src="./shared/acadbeat-local-config.js"></script>
    <script>
        (function () {
            try {
                var p = new URLSearchParams(window.location.search);
                if (p.get('exit_godot') === '1') {
                    document.cookie = 'ui_mode=classic; path=/; max-age=2592000';
                    var u = new URL(window.location.href);
                    u.searchParams.delete('exit_godot');
                    var qs = u.searchParams.toString();
                    window.history.replaceState({}, '', u.pathname + (qs ? '?' + qs : '') + u.hash);
                }
            } catch (_e) {}
        })();
    </script>
    <style>html.acadbeat-role-guard body{visibility:hidden}</style>
    <script>
        document.documentElement.classList.add('acadbeat-role-guard');
        (async function guardAdminHome() {
            try {
                const response = await fetch('./Auth/backend/api/me.php', { credentials: 'include' });
                const data = await response.json().catch(() => ({ status: 'error' }));
                if (data.status === 'success' && data.user && String(data.user.role || '').toLowerCase() === 'admin') {
                    const admin = (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || window.location.origin + '/admin_page/dist/index.html';
                    window.location.replace(admin);
                    return;
                }
            } catch (_err) {}
            document.documentElement.classList.remove('acadbeat-role-guard');
        })();
    </script>
    <style>
        :root {
            --bg-color: #f4efff;
            --primary-color: #facc15;
            --secondary-color: #5b2a86;
            --accent-gold: #facc15; /* 增加金色用于排名 */
            --white: #ffffff;
            --transition-slow: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: all 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 12% 18%, rgba(250, 204, 21, 0.24), transparent 30%),
                radial-gradient(circle at 84% 14%, rgba(91, 42, 134, 0.2), transparent 32%),
                linear-gradient(140deg, #f8f4ff 0%, #efe6ff 52%, #fff7d1 100%);
            color: var(--secondary-color);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .entry-cover {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 18% 18%, rgba(255, 214, 79, 0.34), transparent 34%),
                radial-gradient(circle at 84% 74%, rgba(121, 83, 202, 0.34), transparent 38%),
                linear-gradient(145deg, #f8f4ff 0%, #efe6ff 46%, #fffbe6 100%);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .entry-cover::before,
        .entry-cover::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(14px);
        }

        .entry-cover::before {
            width: 54vw;
            height: 54vw;
            left: -18vw;
            top: -16vw;
            background: radial-gradient(circle, rgba(255, 214, 79, 0.3), transparent 70%);
            animation: coverAuroraA 12s ease-in-out infinite alternate;
        }

        .entry-cover::after {
            width: 46vw;
            height: 46vw;
            right: -14vw;
            bottom: -14vw;
            background: radial-gradient(circle, rgba(121, 83, 202, 0.32), transparent 72%);
            animation: coverAuroraB 14s ease-in-out infinite alternate;
        }

        .entry-cover.is-hidden {
            display: none;
        }

        .entry-cover__card {
            width: min(900px, calc(100% - 40px));
            border-radius: 34px;
            border: 1px solid rgba(255, 255, 255, 0.78);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(245, 239, 255, 0.56)),
                linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0));
            box-shadow:
                0 36px 90px rgba(61, 35, 96, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(22px) saturate(1.15);
            padding: 54px 34px 38px;
            text-align: center;
            position: relative;
        }

        .entry-cover__card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255,255,255,0.24), rgba(255,255,255,0));
            pointer-events: none;
        }

        .entry-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 5.6rem);
            line-height: 1.02;
            letter-spacing: -0.03em;
            color: var(--secondary-color);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 12px 34px rgba(91, 42, 134, 0.22);
            position: relative;
            animation: titleFloat 3.4s ease-in-out infinite;
        }

        .entry-heart {
            display: inline-block;
            font-size: clamp(1.9rem, 5.2vw, 3.2rem);
            transform-origin: center;
            animation: introHeartBeat 1.15s ease-in-out infinite;
            filter: drop-shadow(0 2px 10px rgba(120, 20, 20, 0.45));
        }

        .entry-beat {
            display: inline-block;
            animation: introHeartBeat 1.15s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .entry-plus {
            position: absolute;
            right: -8px;
            top: 4px;
            transform: translateX(100%);
            font-family: 'Playfair Display', serif;
            font-size: clamp(0.72rem, 1.8vw, 1.02rem);
            letter-spacing: 0.14em;
            font-weight: 800;
            text-transform: none;
            color: rgba(77, 36, 118, 0.92);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 248, 214, 0.92));
            border: 1px solid rgba(250, 204, 21, 0.58);
            border-radius: 999px;
            padding: 5px 12px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 22px rgba(250, 204, 21, 0.26);
        }

        .entry-actions {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .entry-login-float {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 4;
        }

        .entry-typing {
            margin: 18px auto 0;
            width: min(980px, 94%);
            min-height: 52px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.22rem, 2.8vw, 2rem);
            letter-spacing: 0.02em;
            color: rgba(91, 42, 134, 0.92);
            text-shadow: 0 8px 24px rgba(91, 42, 134, 0.18);
        }

        .entry-typing-track {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            gap: 0;
            padding: 0 10px 0 20px;
        }

        .entry-typing-char {
            opacity: 0;
            transform: translateY(3px);
            transition: opacity 0.12s ease, transform 0.12s ease;
            white-space: pre;
        }

        .entry-typing-char.is-on {
            opacity: 1;
            transform: translateY(0);
        }

        .entry-typing-heart {
            position: absolute;
            left: 0;
            top: -2px;
            transform: translateX(0);
            font-size: 1.08em;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(125, 24, 24, 0.42));
            transition: left 0.12s linear;
            animation: typingHeartBounce 0.38s ease-in-out infinite;
            pointer-events: none;
        }

        .entry-btn {
            min-height: 50px;
            padding: 0 24px;
            border-radius: 999px;
            border: 1px solid rgba(91, 42, 134, 0.24);
            background: rgba(255, 255, 255, 0.72);
            color: var(--secondary-color);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .entry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(91, 42, 134, 0.16);
        }

        .entry-btn--primary {
            background: linear-gradient(135deg, #facc15 0%, #ffd84a 100%);
            border-color: rgba(250, 204, 21, 0.82);
        }

        .entry-action-main {
            min-height: 62px;
            min-width: clamp(210px, 24vw, 290px);
            padding: 0 30px;
            border-radius: 18px;
            font-size: clamp(0.82rem, 1.25vw, 1rem);
            letter-spacing: 0.09em;
            box-shadow: 0 16px 36px rgba(61, 35, 96, 0.16);
            backdrop-filter: blur(8px);
            border-width: 1.5px;
        }

        .entry-action-main.entry-btn--classic {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(245, 238, 255, 0.86));
            border-color: rgba(91, 42, 134, 0.26);
            color: #4d2a72;
        }

        .entry-action-main.entry-btn--explore {
            background: linear-gradient(135deg, #facc15 0%, #ffd84a 60%, #ffe37d 100%);
            border-color: rgba(250, 204, 21, 0.9);
            color: #48246b;
            box-shadow: 0 18px 40px rgba(250, 204, 21, 0.32);
        }

        .entry-action-main:hover {
            transform: translateY(-3px) scale(1.015);
        }

        .entry-btn--login {
            min-height: 44px;
            padding: 0 18px;
            font-size: 0.74rem;
            letter-spacing: 0.1em;
            opacity: 0.92;
        }

        .entry-btn--login.entry-btn--logged-in {
            text-transform: none;
            letter-spacing: 0.03em;
            font-weight: 700;
            max-width: min(52vw, 260px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @keyframes introHeartBeat {
            0%, 100% { transform: scale(1); }
            18% { transform: scale(1.22); }
            36% { transform: scale(0.98); }
            54% { transform: scale(1.16); }
            72% { transform: scale(1); }
        }

        @keyframes typingHeartBounce {
            0%, 100% { margin-top: 0; }
            50% { margin-top: -6px; }
        }

        @keyframes coverAuroraA {
            from { transform: translate3d(0,0,0) scale(1); }
            to { transform: translate3d(3vw,2vh,0) scale(1.12); }
        }

        @keyframes coverAuroraB {
            from { transform: translate3d(0,0,0) scale(1); }
            to { transform: translate3d(-3vw,-2vh,0) scale(1.1); }
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* --- MAIN VIEWPORT --- */
        main {
            margin-top: 80px;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .module-label {
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .module-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(1180px, 100%);
            animation: moduleReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            gap: 22px;
        }

        .home-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .home-bg::before,
        .home-bg::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(18px);
            animation: drift 16s ease-in-out infinite alternate;
        }

        .home-bg::before {
            width: 46vw;
            height: 46vw;
            top: -12vw;
            left: -8vw;
            background: radial-gradient(circle, rgba(250, 204, 21, 0.24), rgba(250, 204, 21, 0.04) 60%, transparent 74%);
        }

        .home-bg::after {
            width: 38vw;
            height: 38vw;
            right: -12vw;
            bottom: -10vw;
            background: radial-gradient(circle, rgba(91, 42, 134, 0.24), rgba(91, 42, 134, 0.05) 62%, transparent 76%);
            animation-delay: -4s;
        }

        .home-gridline {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(91, 42, 134, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91, 42, 134, 0.04) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.85), transparent 72%);
        }

        .hero-panel {
            width: min(1020px, 100%);
            padding: 34px 38px;
            border-radius: 28px;
            border: 1px solid rgba(91, 42, 134, 0.18);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.82), rgba(250, 247, 255, 0.56));
            backdrop-filter: blur(12px);
            text-align: left;
            box-shadow: 0 28px 58px rgba(91, 42, 134, 0.16);
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 4.2vw, 4rem);
            line-height: 1.02;
            letter-spacing: -0.03em;
            margin-bottom: 14px;
        }

        .hero-subtitle {
            max-width: 78ch;
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(91, 42, 134, 0.8);
        }

        .module-spotlight {
            width: min(1020px, 100%);
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 18px;
        }

        .spot-card {
            border-radius: 22px;
            border: 1px solid rgba(91, 42, 134, 0.16);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 16px 36px rgba(91, 42, 134, 0.12);
            padding: 24px;
            text-align: left;
        }

        .spot-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.52rem;
            margin-bottom: 8px;
        }

        .spot-card p {
            color: rgba(91, 42, 134, 0.76);
            line-height: 1.72;
            font-size: 0.95rem;
        }

        .spot-badges {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .spot-badge {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 0 11px;
            border-radius: 999px;
            border: 1px solid rgba(91, 42, 134, 0.16);
            background: rgba(250, 204, 21, 0.22);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .signal-orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 4px auto 14px;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.96), rgba(250, 204, 21, 0.88) 55%, rgba(91, 42, 134, 0.8));
            box-shadow: 0 24px 44px rgba(91, 42, 134, 0.2);
            animation: pulseOrb 2.6s ease-in-out infinite;
        }

        .module-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* --- LEXIS (VOCABULARY) --- */
        .quote-wrap {
            max-width: 850px;
            margin-bottom: 3.5rem;
            padding: 2rem 0;
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-style: italic;
            line-height: 1.2;
            margin-bottom: 2rem;
        }

        .quote-author {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.5;
        }

        /* --- INSIGHT (VIDEO) --- */
        .lens-visual {
            width: 450px;
            height: 220px;
            margin-bottom: 3.5rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lens-ring {
            position: absolute;
            border: 1.2px solid var(--primary-color);
            border-radius: 50%;
        }

        .ring-1 {
            width: 220px;
            height: 220px;
            border-style: dashed;
            animation: rotateCW 12s linear infinite;
        }

        .ring-2 {
            width: 170px;
            height: 170px;
            animation: rotateCCW 8s linear infinite;
            opacity: 0.6;
        }

        .video-bar {
            width: 2px;
            background: var(--secondary-color);
            margin: 0 3px;
            animation: videoPulse 1.5s ease-in-out infinite alternate;
        }

        /* --- DIALOGUE (REPLACED WITH SPEAKING BUBBLES) --- */
        .vocal-dialogue {
            width: 380px;
            height: 100px;
            position: relative;
            margin-bottom: 3.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .bubble {
            background: rgba(250, 204, 21, 0.16);
            border: 1.5px solid var(--primary-color);
            border-radius: 12px;
            position: relative;
            animation: bubbleBreath 4s ease-in-out infinite;
            backdrop-filter: blur(4px);
        }

        .bubble-left {
            width: 180px;
            height: 45px;
            margin-top: 5px;
        }

        .bubble-right {
            width: 140px;
            height: 35px;
            align-self: flex-end;
            animation-delay: 2s;
        }

        .bubble::after,
        .bubble::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .bubble-left::after {
            border-width: 12px 10px 0 0;
            border-color: var(--primary-color) transparent transparent transparent;
            bottom: -12px;
            left: 18px;
        }

        .bubble-left::before {
            border-width: 9px 7px 0 0;
            border-color: var(--bg-color) transparent transparent transparent;
            bottom: -9px;
            left: 19.5px;
            z-index: 2;
        }

        .bubble-right::after {
            border-width: 12px 10px 0 0;
            border-color: var(--primary-color) transparent transparent transparent;
            bottom: -12px;
            right: 8px;
            transform: scaleX(-1);
        }

        .bubble-right::before {
            border-width: 9px 7px 0 0;
            border-color: var(--bg-color) transparent transparent transparent;
            bottom: -9px;
            right: 9.5px;
            z-index: 2;
            transform: scaleX(-1);
        }

        /* --- METHOD (TECH SUPPORT) --- */
        .method-isometric {
            width: 400px;
            height: 200px;
            margin-bottom: 3.5rem;
            position: relative;
            perspective: 1200px;
        }

        .iso-card {
            position: absolute;
            width: 120px;
            height: 140px;
            border: 1px solid var(--secondary-color);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            transform: rotateX(45deg) rotateZ(-25deg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: isoFloat 4s ease-in-out infinite alternate;
        }

        .iso-ui-element {
            width: 100%;
            height: 6px;
            background: var(--primary-color);
            opacity: 0.3;
            border-radius: 2px;
        }

        .iso-ui-header {
            width: 40%;
            height: 10px;
            background: var(--secondary-color);
            opacity: 0.2;
            margin-bottom: 5px;
        }

        /* --- DAILY FOCUS CARD --- */
        .daily-focus-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(91, 42, 134, 0.16);
            padding: 2.2rem 3rem;
            border-radius: 2px;
            display: flex;
            align-items: center;
            gap: 3rem;
            text-align: left;
            margin-bottom: 4rem;
            backdrop-filter: blur(8px);
            min-width: 600px;
        }

        .card-number {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--primary-color);
            opacity: 0.7;
            font-style: italic;
        }

        .card-content h4 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.6rem;
            opacity: 0.5;
            font-weight: 800;
        }

        .card-content p {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            line-height: 1.3;
            color: var(--secondary-color);
            font-weight: 500;
        }

        /* --- BUTTONS --- */
        .bottom-actions {
            display: flex;
            gap: 20px;
        }

        .btn-small {
            padding: 12px 35px;
            border-radius: 40px;
            border: 1.2px solid var(--secondary-color);
            background: transparent;
            color: var(--secondary-color);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.4s;
        }

        .btn-small:hover {
            transform: translateY(-3px);
            background-color: var(--secondary-color);
            color: var(--bg-color);
        }

        .btn-primary-small {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--secondary-color);
        }

        /* 添加到 style 标签内 */
        .user-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition-fast);
            /* 使用你已有的过渡变量，或者用 0.4s */
        }

        .user-section:hover {
            opacity: 0.7;
        }

        .user-section:hover .avatar {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        .logout-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid rgba(91, 42, 134, 0.24);
            background: rgba(255, 255, 255, 0.72);
            color: var(--secondary-color);
            text-decoration: none;
            font-size: 0.72rem;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .logout-link:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.94);
            border-color: rgba(91, 42, 134, 0.4);
        }

        .auth-modal {
            position: fixed;
            inset: 0;
            background:

        .site-modal {
            position: fixed;

                radial-gradient(circle at top, rgba(250, 204, 21, 0.2), transparent 32%),

            align-items: center;
            justify-content: center;
            z-index: 9300;
            padding: 24px;
        }

        .site-modal.is-open {
            display: flex;
        }

        .site-modal__card {
            width: min(440px, 100%);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(249, 245, 239, 0.96)),
                var(--bg-color);
            border: 1px solid rgba(91, 42, 134, 0.16);
            border-radius: 30px;
            box-shadow:
                0 28px 80px rgba(91, 42, 134, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.78);
            padding: 30px 30px 24px;
        }

        .site-modal__title {
            font-size: 1.9rem;
            line-height: 1.06;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.03em;
        }

        .site-modal__body {
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(91, 42, 134, 0.8);
        }

        .site-modal__actions {
            display: flex;
            justify-content: flex-start;
            margin-top: 24px;
        }

        .site-modal__actions .btn-small {
            min-width: 118px;
            min-height: 44px;
            border-radius: 999px;
            box-shadow: 0 12px 28px rgba(91, 42, 134, 0.18);
        }

        .user-group { display: flex; align-items: center; gap: 30px; }

        /* --- ANIMATIONS --- */
        @keyframes moduleReveal {
            from {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes drift {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }
            to {
                transform: translate3d(16px, -12px, 0) scale(1.06);
            }
        }

        @keyframes pulseOrb {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 24px 44px rgba(91, 42, 134, 0.2);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 30px 54px rgba(91, 42, 134, 0.28);
            }
        }

        @keyframes rotateCW {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateCCW {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes videoPulse {
            from {
                height: 10%;
                opacity: 0.3;
            }

            to {
                height: 45%;
                opacity: 0.9;
            }
        }

        @keyframes bubbleBreath {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.03);
                opacity: 0.95;
            }
        }

        @keyframes isoFloat {
            from {
                transform: rotateX(45deg) rotateZ(-25deg) translateY(0);
            }

            to {
                transform: rotateX(45deg) rotateZ(-25deg) translateY(-20px);
            }
        }

        /* --- Fullscreen module effects (large-range) --- */
        .module-content {
            position: relative;
            width: 100%;
            height: calc(100vh - 80px);
            justify-content: center;
            overflow: hidden;
        }

        .fx-stage {
            position: absolute;
            inset: -12vh -8vw -12vh -8vw;
            pointer-events: none;
            z-index: 1;
        }

        .module-core {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .module-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 6.2vw, 5.6rem);
            line-height: 1.02;
            letter-spacing: -0.03em;
            text-align: center;
            text-shadow: 0 8px 28px rgba(91, 42, 134, 0.2);
        }

        .module-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .module-actions .btn-small {
            min-width: 220px;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 34px rgba(91, 42, 134, 0.18);
            border-color: rgba(91, 42, 134, 0.35);
            background: rgba(255, 255, 255, 0.34);
        }

        .module-actions .btn-primary-small {
            background: linear-gradient(135deg, #facc15 0%, #ffd84a 100%);
            color: #5b2a86;
            border-color: rgba(250, 204, 21, 0.8);
            box-shadow: 0 18px 40px rgba(250, 204, 21, 0.28);
        }

        .gate-enter-btn {
            min-height: 52px;
            padding: 0 28px;
            border-radius: 999px;
            font-size: 0.84rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 800;
        }

        .module-actions .btn-primary-small:hover {
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, #ffd84a 0%, #facc15 100%);
        }

        .fx-particle {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.75;
        }

        /* Lexis: word orbit field */
        .fx-lexis .ring {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed rgba(91, 42, 134, 0.28);
            animation: spinSlow 26s linear infinite;
        }
        .fx-lexis .ring.r1 { width: min(78vw, 860px); height: min(78vw, 860px); }
        .fx-lexis .ring.r2 { width: min(58vw, 640px); height: min(58vw, 640px); animation-direction: reverse; }
        .fx-lexis .ring.r3 { width: min(38vw, 420px); height: min(38vw, 420px); }
        .fx-lexis .token {
            position: absolute;
            color: rgba(91, 42, 134, 0.7);
            font-size: clamp(0.72rem, 1.2vw, 1rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            animation: floatY 7s ease-in-out infinite;
        }

        /* Insight: cinematic scan grid */
        .fx-insight {
            background:
                linear-gradient(rgba(91, 42, 134, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91, 42, 134, 0.06) 1px, transparent 1px);
            background-size: 44px 44px;
        }
        .fx-insight::before {
            content: "";
            position: absolute;
            inset: -20% -10%;
            background: radial-gradient(circle at 50% 46%, rgba(250, 204, 21, 0.3), rgba(250, 204, 21, 0.02) 48%, transparent 72%);
            animation: breathe 4s ease-in-out infinite;
        }
        .fx-insight::after {
            content: "";
            position: absolute;
            top: -15%;
            left: -30%;
            width: 40%;
            height: 130%;
            background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.22), transparent);
            transform: skewX(-14deg);
            animation: scanMove 5.4s ease-in-out infinite;
        }

        /* Dialogue: pulse thread network */
        .fx-dialogue .node {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(91, 42, 134, 0.84);
            box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.12);
            animation: nodePulse 2.2s ease-in-out infinite;
        }
        .fx-dialogue .link {
            position: absolute;
            height: 2px;
            transform-origin: left center;
            background: linear-gradient(90deg, rgba(91, 42, 134, 0.12), rgba(91, 42, 134, 0.58), rgba(91, 42, 134, 0.12));
        }
        .fx-dialogue .pulse {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(250, 204, 21, 0.9);
            filter: blur(0.5px);
            animation: travel 4.6s linear infinite;
        }

        /* Method: blueprint circuit flow */
        .fx-method .circuit {
            position: absolute;
            border: 1px solid rgba(91, 42, 134, 0.28);
            border-radius: 10px;
            animation: breathe 4.8s ease-in-out infinite;
        }
        .fx-method .trace {
            position: absolute;
            height: 2px;
            background: rgba(91, 42, 134, 0.26);
        }
        .fx-method .signal {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(250, 204, 21, 0.95);
            box-shadow: 0 0 18px rgba(250, 204, 21, 0.6);
            animation: signalRun 4.4s ease-in-out infinite;
        }

        @keyframes spinSlow { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes floatY { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-18px);} }
        @keyframes breathe { 0%,100%{ opacity: 0.68; transform: scale(1);} 50%{ opacity: 1; transform: scale(1.04);} }
        @keyframes scanMove { 0%{ left: -35%; } 55%{ left: 115%; } 100%{ left: 115%; } }
        @keyframes nodePulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.25);} }
        @keyframes travel {
            0% { transform: translate(-32vw, -18vh); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translate(0vw, 0vh); opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(32vw, 18vh); opacity: 0; }
        }
        @keyframes signalRun {
            0% { transform: translate(0, 0); }
            25% { transform: translate(28vw, 0); }
            50% { transform: translate(28vw, 18vh); }
            75% { transform: translate(0, 18vh); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>

    <div id="challengeMount" class="challenge-mount" aria-hidden="true"></div>

    <script>
        const L = window.ACADBEAT_LOCAL || {};
        const HOME_URL = './home.html';
        const OWNER_URL = './owner.html';
        const ADMIN_URL = L.adminDistUrl || window.location.origin + '/admin_page/dist/index.html';
        const ACADEMIC_GATE_URL = './academic-gate.html';
        const VOCABULARY_URL = './vocba_prac/';
        const FORUM_URL = L.forumDevChooserUrl || (window.location.origin + '/forum-project/dist/index.html?view=forum');
        const TECHNOLOGY_URL = L.technologyUrl || './technology-gate.html';
        const ACADEMIC_PRACTICE_URL = './Academic-Practice/training.html';
        const AUTH_API_BASE = './Auth/backend/api';
        const authState = { user: null, mode: 'login' };
        window.authState = authState;
        let currentHomeModule = 'Insight';
        let pendingGodotSwitch = false;
        let pendingEntryMode = null;
        let coverHidden = false;
        let typingTimer = null;
        let challengeBundlePromise = null;

        function bootChallengeBundle() {
            if (challengeBundlePromise) {
                return challengeBundlePromise;
            }
            challengeBundlePromise = (async function loadChallengeUi() {
                const mount = document.getElementById('challengeMount');
                if (!mount || mount.dataset.challengeLoaded === '1') {
                    return;
                }
                const response = await fetch('./challenge/challenge-panel.html', { credentials: 'same-origin' });
                if (!response.ok) {
                    return;
                }
                mount.innerHTML = await response.text();
                mount.dataset.challengeLoaded = '1';
                await new Promise(function (resolve, reject) {
                    const script = document.createElement('script');
                    script.src = './challenge/challenge-home.js';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.body.appendChild(script);
                });
            })().catch(function () {});
            return challengeBundlePromise;
        }

        function setUiMode(mode) {
            document.cookie = `ui_mode=${encodeURIComponent(mode)}; path=/; max-age=2592000`;
        }

        function openGodotMode(event) {
            if (event) event.preventDefault();
            setUiMode('godot');
            window.location.href = L.godotWebEntryUrl || 'http://127.0.0.1:5500/index.html?ui=godot';
            return false;
        }

        function hideEntryCover() {
            if (coverHidden) return;
            coverHidden = true;
            const cover = document.getElementById('entryCover');
            if (!cover) return;
            cover.classList.add('is-hidden');
            cover.setAttribute('aria-hidden', 'true');
        }

        function showEntryCover() {
            coverHidden = false;
            const cover = document.getElementById('entryCover');
            if (!cover) return;
            cover.classList.remove('is-hidden');
            cover.setAttribute('aria-hidden', 'false');
        }

        function syncEntryLoginButton() {
            const btn = document.getElementById('entryLoginBtn');
            if (!btn) return;
            const u = authState.user;
            if (u && String(u.role || '').toLowerCase() !== 'admin') {
                const raw = String(u.username || u.email || 'Account').trim();
                btn.textContent = raw.length > 26 ? `${raw.slice(0, 24)}…` : raw;
                btn.classList.add('entry-btn--logged-in');
                btn.title = 'Open your account';
                btn.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.location.href = portalUrlForCurrentUser();
                };
            } else {
                btn.textContent = 'Login / Register';
                btn.classList.remove('entry-btn--logged-in');
                btn.title = '';
                btn.onclick = function (e) {
                    e.stopPropagation();
                    openEntryLogin();
                };
            }
        }

        function shouldBypassEntryCover(params) {
            if (!params) return false;
            return params.get('login') === '1';
        }

        function openEntryLogin() {
            openAuthModal('login');
        }

        function chooseClassicUi() {
            setUiMode('classic');
            if (authState.user) {
                pendingEntryMode = null;
                window.location.href = ACADEMIC_GATE_URL;
                return;
            }
            pendingEntryMode = 'classic';
            openAuthModal('login', 'Please log in before entering Classical Version.');
        }

        function playGodotUi() {
            setUiMode('godot');
            if (authState.user) {
                pendingEntryMode = null;
                hideEntryCover();
                openGodotMode(null);
                return;
            }
            pendingEntryMode = 'godot';
            requestSwitchToGodot();
        }

        function initEntryTyping() {
            const phrase = 'Help you successfully enroll in Diicsu.';
            const textMount = document.getElementById('entryTypingText');
            const heart = document.getElementById('entryTypingHeart');
            if (!textMount || !heart) return;

            textMount.innerHTML = '';
            const chars = Array.from(phrase).map((ch) => {
                const span = document.createElement('span');
                span.className = 'entry-typing-char';
                span.textContent = ch;
                textMount.appendChild(span);
                return span;
            });

            function positionHeart(index) {
                if (!chars.length) return;
                const safe = Math.max(0, Math.min(index, chars.length - 1));
                const target = chars[safe];
                heart.style.left = `${target.offsetLeft - 16}px`;
            }

            function clearLine() {
                chars.forEach((el) => el.classList.remove('is-on'));
                heart.style.left = `0px`;
            }

            let i = 0;
            function loopTyping() {
                clearLine();
                i = 0;
                if (typingTimer) window.clearInterval(typingTimer);
                typingTimer = window.setInterval(() => {
                    if (i < chars.length) {
                        chars[i].classList.add('is-on');
                        positionHeart(i);
                        i += 1;
                        return;
                    }
                    window.clearInterval(typingTimer);
                    typingTimer = window.setTimeout(loopTyping, 900);
                }, 85);
            }

            loopTyping();
        }

        function requestSwitchToGodot() {
            if (authState.user) {
                openGodotMode(null);
                return;
            }
            pendingGodotSwitch = true;
            openAuthModal('login', '请先登录后再切换到 Godot 主页。');
        }

        function portalUrlForCurrentUser() {
            if (authState.user && String(authState.user.role || '').toLowerCase() === 'admin') {
                return ADMIN_URL;
            }
            return OWNER_URL;
        }

        function normalizePostLoginUrl(rawUrl) {
            try {
                const target = new URL(rawUrl, window.location.origin);
                if (target.origin !== window.location.origin) {
                    return null;
                }
                const path = target.pathname.toLowerCase();
                const map = {};
                if (map[path]) return map[path];
                return target.toString();
            } catch (_err) {
                return null;
            }
        }

        function mountHomeGodotSwitchInNav() {
            // 只在 academic 模块页面添加 switch 按钮
            if (currentHomeModule !== 'Insight') {
                return;
            }
            const nav = document.querySelector('#acadbeatNav .acadbeat-shared-nav');
            const userGroup = nav && nav.querySelector('.user-group');
            if (!userGroup) {
                return;
            }
            const oldBtn = document.getElementById('homeGodotSwitchBtn');
            if (oldBtn && oldBtn.parentNode) {
                oldBtn.parentNode.removeChild(oldBtn);
            }
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nav-godot';
            btn.id = 'homeGodotSwitchBtn';
            btn.textContent = 'Switch';
            btn.title = '切换到 Godot 动态主页（需先登录）';
            btn.addEventListener('click', requestSwitchToGodot);
            const userSection = userGroup.querySelector('.user-section');
            if (userSection) {
                userGroup.insertBefore(btn, userSection);
            } else {
                userGroup.appendChild(btn);
            }
        }

        const data = {
            // 修复点 2: 统一 Lexis 的按钮数据结构，确保 btn 存在
            Lexis: { label: "Section I — Lexical Depth", btn: "Start Study" },
            Insight: { label: "Section II — Visual Intelligence", id: "02", topic: "Visual Anthropology: A Cinematic Study", btn: "View Stream" },
            Dialogue: { label: "Section III — Collective Intellect", id: "03", topic: "Current Thread: Linguistic Relativity in AI", btn: "Enter Forum" },
            Method: { label: "Section IV — Technical Support", id: "04", topic: "Workflow Optimization: Academic Toolkit", btn: "Get Support" }
        };

        function navActiveForModule(name) {
            if (name === 'Dialogue') return 'forum';
            if (name === 'Method') return 'technology';
            return 'academic';
        }

        function resolveModuleName(rawName) {
            const key = String(rawName || '').trim().toLowerCase();
            const map = {
                lexis: 'Lexis',
                vocabulary: 'Lexis',
                insight: 'Insight',
                academic: 'Insight',
                dialogue: 'Dialogue',
                forum: 'Dialogue',
                method: 'Method',
                technology: 'Method'
            };
            return map[key] || 'Insight';
        }

        function initialsOf(name) {
            const trimmed = String(name || '').trim();
            if (!trimmed) return 'IN';
            return trimmed.slice(0, 2).toUpperCase();
        }

        async function refreshSharedNav() {
            if (typeof window.initializeAcadBeatNav !== 'function') {
                return;
            }
            await window.initializeAcadBeatNav({
                mountId: 'acadbeatNav',
                basePath: './',
                active: navActiveForModule(currentHomeModule),
                showSwitchButton: false,
                academicUrl: './academic-gate.html',
                authApiBase: './Auth/backend/api',
                homeUrl: './home.html',
                ownerUrl: './owner.html',
                adminUrl: L.adminDistUrl || window.location.origin + '/admin_page/dist/index.html',
                forumUrl: './forum-gate.html',
                technologyUrl: L.technologyUrl || './technology-gate.html',
                studioUrl: './studio-gate.html',
                competitionUrl: './competition-gate.html',
                messageCenterUrl: L.messageCenterDistUrl || (window.location.origin + '/message-center-project/dist/index.html'),
                redirectAdmins: true,
                showChallengeButton: false
            });
            authState.user = (window.acadbeatNavState && window.acadbeatNavState.user) || authState.user;
            mountHomeGodotSwitchInNav();
            syncEntryLoginButton();
        }

        async function authFetch(path, options = {}) {
            const response = await fetch(`${AUTH_API_BASE}/${path}`, {
                method: options.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                credentials: 'include',
                body: options.body || undefined
            });
            const data = await response.json().catch(() => ({ status: 'error', message: 'Invalid response' }));
            return data;
        }

        async function loadAuthUser() {
            const data = await authFetch('me.php');
            authState.user = data.status === 'success' ? data.user : null;
            await refreshSharedNav();
        }

        function openAuthModal(mode = 'login', message = '') {
            setAuthMode(mode);
            document.getElementById('authModal').classList.add('is-open');
            document.getElementById('authModal').setAttribute('aria-hidden', 'false');
            document.getElementById('authMessage').textContent = message;
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('is-open');
            document.getElementById('authModal').setAttribute('aria-hidden', 'true');
            document.getElementById('authMessage').textContent = '';
        }

        function cancelAuthModal() {
            pendingGodotSwitch = false;
            pendingEntryMode = null;
            closeAuthModal();
        }

        function openSiteModal(title, message, onConfirm) {
            const modal = document.getElementById('siteModal');
            const titleEl = document.getElementById('siteModalTitle');
            const bodyEl = document.getElementById('siteModalBody');
            const confirmBtn = document.getElementById('siteModalConfirm');
            if (!modal || !titleEl || !bodyEl || !confirmBtn) return;
            titleEl.textContent = title || 'Notice';
            bodyEl.textContent = message || '';
            confirmBtn.onclick = function () {
                modal.classList.remove('is-open');
                modal.setAttribute('aria-hidden', 'true');
                if (typeof onConfirm === 'function') onConfirm();
            };
            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function setAuthMode(mode) {
            authState.mode = mode;
            const loginMode = mode === 'login';
            document.getElementById('tabLogin').classList.toggle('active', loginMode);
            document.getElementById('tabRegister').classList.toggle('active', !loginMode);
            document.getElementById('fieldIdentifier').classList.toggle('auth-hidden', !loginMode);
            document.getElementById('fieldUsername').classList.toggle('auth-hidden', loginMode);
            document.getElementById('fieldEmail').classList.toggle('auth-hidden', loginMode);
            document.getElementById('fieldConfirm').classList.toggle('auth-hidden', loginMode);
            document.getElementById('authTitle').textContent = loginMode ? 'Login' : 'Register';
            document.getElementById('authSubtitle').textContent = loginMode ? 'Sign in before entering any module.' : 'Create your account in AcadBeat.';
            document.getElementById('authSubmitBtn').textContent = loginMode ? 'Login' : 'Register';
            document.getElementById('authMessage').textContent = '';
        }

        async function submitAuthForm(event) {
            event.preventDefault();
            const mode = authState.mode;
            const messageEl = document.getElementById('authMessage');
            messageEl.textContent = '';

            const payload = mode === 'login'
                ? {
                    identifier: document.getElementById('authIdentifier').value.trim(),
                    password: document.getElementById('authPassword').value
                }
                : {
                    username: document.getElementById('authUsername').value.trim(),
                    email: document.getElementById('authEmail').value.trim(),
                    password: document.getElementById('authPassword').value
                };

            if (mode === 'register' && document.getElementById('authPassword').value !== document.getElementById('authConfirm').value) {
                messageEl.textContent = 'Passwords do not match.';
                return;
            }

            const endpoint = mode === 'login' ? 'login.php' : 'register.php';
            const data = await authFetch(endpoint, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (data.status !== 'success') {
                messageEl.textContent = data.message || 'Authentication failed.';
                return;
            }

            authState.user = data.user || null;
            await refreshSharedNav();
            await bootChallengeBundle();
            if (window.challengeHome && typeof window.challengeHome.syncAccess === 'function') {
                window.challengeHome.syncAccess(authState.user);
            }
            if (authState.user && String(authState.user.role || '').toLowerCase() === 'admin') {
                pendingGodotSwitch = false;
                closeAuthModal();
                window.location.href = ADMIN_URL;
                return;
            }
            if (pendingGodotSwitch && authState.user) {
                pendingGodotSwitch = false;
                pendingEntryMode = null;
                closeAuthModal();
                openGodotMode(null);
                return;
            }
            if (pendingEntryMode === 'classic' && authState.user) {
                pendingEntryMode = null;
                closeAuthModal();
                window.location.href = ACADEMIC_GATE_URL;
                return;
            }
            if (pendingEntryMode === 'godot' && authState.user) {
                pendingEntryMode = null;
                closeAuthModal();
                openGodotMode(null);
                return;
            }
            if (authState.user) {
                try {
                    const p = new URLSearchParams(window.location.search);
                    const raw = p.get('from');
                    if (raw) {
                        const normalized = normalizePostLoginUrl(decodeURIComponent(raw));
                        if (normalized) {
                            closeAuthModal();
                            window.location.replace(normalized);
                            return;
                        }
                    }
                } catch (_err) {}
            }
            closeAuthModal();
        }

        function handleUserAction() {
            if (authState.user) {
                window.location.href = portalUrlForCurrentUser();
                return;
            }
            openAuthModal('login');
        }

        async function handleLogout(event) {
            if (event) event.preventDefault();
            if (!authState.user) return false;
            await authFetch('logout.php');
            authState.user = null;
            await refreshSharedNav();
            closeAuthModal();
            loadModule('Insight');
            return false;
        }

        function isGodotUiMode() {
            try {
                const p = new URLSearchParams(window.location.search);
                if (p.get('ui') === 'godot') return true;
            } catch (_e) {}
            return document.cookie.split('; ').some((c) => c.startsWith('ui_mode=godot'));
        }

        function handleModuleAction(name) {
            if (!authState.user) {
                // Keep module behavior consistent: unauthenticated users should login first.
                // Do not force redirect to Godot just because ui_mode cookie is set.
                openAuthModal('login', 'Please log in before using module actions.');
                return;
            }
            if (name === 'Lexis') {
                window.location.href = VOCABULARY_URL;
                return;
            }
            if (name === 'Dialogue') {
                window.location.href = FORUM_URL;
                return;
            }
            if (name === 'Insight') {
                window.location.href = ACADEMIC_PRACTICE_URL;
                return;
            }
            if (name === 'Method') {
                window.location.href = TECHNOLOGY_URL;
                return;
            }
            openSiteModal('Not connected yet', 'This module action has not been connected yet.');
        }

        function loadModule(name) {
            currentHomeModule = name;
            const viewport = document.getElementById('app-viewport');
            const m = data[name];
            const titleMap = {
                Lexis: 'Lexis',
                Insight: 'Academic',
                Dialogue: 'Dialogue',
                Method: 'Method'
            };

            function fxMarkup(moduleName) {
                if (moduleName === 'Lexis') {
                    return `
                        <div class="fx-stage fx-lexis">
                            <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
                            <span class="token" style="left:18%;top:22%;animation-delay:-0.4s;">syntax</span>
                            <span class="token" style="left:74%;top:18%;animation-delay:-1.1s;">nuance</span>
                            <span class="token" style="left:12%;top:68%;animation-delay:-1.8s;">semantic</span>
                            <span class="token" style="left:80%;top:70%;animation-delay:-2.3s;">lexicon</span>
                            <span class="token" style="left:46%;top:10%;animation-delay:-0.9s;">context</span>
                            <span class="token" style="left:44%;top:82%;animation-delay:-2.6s;">precision</span>
                        </div>`;
                }
                if (moduleName === 'Insight') {
                    return `<div class="fx-stage fx-insight"></div>`;
                }
                if (moduleName === 'Dialogue') {
                    return `
                        <div class="fx-stage fx-dialogue">
                            <div class="link" style="left:16%;top:34%;width:34%;transform:rotate(18deg)"></div>
                            <div class="link" style="left:48%;top:44%;width:30%;transform:rotate(-16deg)"></div>
                            <div class="link" style="left:20%;top:64%;width:44%;transform:rotate(-8deg)"></div>
                            <div class="link" style="left:56%;top:64%;width:24%;transform:rotate(22deg)"></div>
                            <div class="node" style="left:16%;top:34%;animation-delay:-0.3s"></div>
                            <div class="node" style="left:48%;top:44%;animation-delay:-1.1s"></div>
                            <div class="node" style="left:78%;top:36%;animation-delay:-0.8s"></div>
                            <div class="node" style="left:20%;top:64%;animation-delay:-1.6s"></div>
                            <div class="node" style="left:56%;top:64%;animation-delay:-2.2s"></div>
                            <div class="node" style="left:80%;top:72%;animation-delay:-1.9s"></div>
                            <div class="pulse" style="left:50%;top:50%;animation-delay:-0.2s"></div>
                            <div class="pulse" style="left:50%;top:50%;animation-delay:-2.2s"></div>
                        </div>`;
                }
                return `
                    <div class="fx-stage fx-method">
                        <div class="circuit" style="left:8%;top:18%;width:34%;height:26%;animation-delay:-0.6s"></div>
                        <div class="circuit" style="left:52%;top:20%;width:38%;height:30%;animation-delay:-1.8s"></div>
                        <div class="circuit" style="left:20%;top:56%;width:56%;height:28%;animation-delay:-2.4s"></div>
                        <div class="trace" style="left:42%;top:31%;width:12%"></div>
                        <div class="trace" style="left:40%;top:70%;width:22%"></div>
                        <div class="signal" style="left:20%;top:56%"></div>
                    </div>`;
            }

            const title = titleMap[name] || 'Insight';
            let html = `<div class="module-content">
                ${fxMarkup(name)}
                <div class="module-core">
                    <div class="module-title">${title}</div>
                    <div class="module-actions">
                        <button class="btn-small btn-primary-small gate-enter-btn" onclick="handleModuleAction('${name}')">${m.btn}</button>
                    </div>
                </div>
            </div>`;
            viewport.innerHTML = html;
        }

        // 初始化加载
        window.onload = async () => {
            initEntryTyping();
            const params = new URLSearchParams(window.location.search);
            const forceEntryLanding = params.get('entry') === '1';
            if (forceEntryLanding) {
                showEntryCover();
                const viewport = document.getElementById('app-viewport');
                if (viewport) {
                    viewport.innerHTML = '';
                }
                try {
                    const u = new URL(window.location.href);
                    u.searchParams.delete('entry');
                    const qs = u.searchParams.toString();
                    window.history.replaceState({}, '', u.pathname + (qs ? `?${qs}` : '') + u.hash);
                } catch (_err) {}
            }
            const paramsAfter = new URLSearchParams(window.location.search);
            const moduleParam = paramsAfter.get('module');
            if (moduleParam && !forceEntryLanding) {
                const moduleName = resolveModuleName(moduleParam);
                loadModule(moduleName);
            } else if (!forceEntryLanding) {
                const viewport = document.getElementById('app-viewport');
                if (viewport) {
                    viewport.innerHTML = '';
                }
            }
            await refreshSharedNav();
            if (paramsAfter.get('challenge') === '1') {
                hideEntryCover();
            }
            await bootChallengeBundle();
            if (window.challengeHome) {
                window.challengeHome.syncAccess(authState.user);
                window.challengeHome.handleInitialRoute(paramsAfter);
            }
            if (shouldBypassEntryCover(paramsAfter)) {
                hideEntryCover();
            }
            if (authState.user && paramsAfter.get('login') === '1' && paramsAfter.get('from')) {
                try {
                    const normalized = normalizePostLoginUrl(decodeURIComponent(paramsAfter.get('from')));
                    if (normalized) {
                        window.location.replace(normalized);
                        return;
                    }
                } catch (_err) {}
            }
            if (paramsAfter.get('login') === '1' && !authState.user) {
                hideEntryCover();
                openAuthModal('login', 'Please log in first.');
            }
        };
    </script>
    <script src="./shared-nav.js"></script>
</body>

</html>
