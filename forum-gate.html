<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum</title>
  <link rel="stylesheet" href="./shared-nav.css">
  <link rel="stylesheet" href="./shared-gate.css">
  <script src="./shared/acadbeat-local-config.js"></script>
  <style>
    /* Forum-only: network nodes + traveling pulses */
    .gate-fx--forum .forum-node {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(91, 42, 134, 0.84);
      box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.12);
      animation: gateForumNodePulse 2.2s ease-in-out infinite;
    }
    .gate-fx--forum .forum-link {
      position: absolute;
      height: 2px;
      transform-origin: left center;
      background: linear-gradient(90deg, rgba(91, 42, 134, 0.12), rgba(91, 42, 134, 0.58), rgba(91, 42, 134, 0.12));
    }
    .gate-fx--forum .forum-pulse {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(250, 204, 21, 0.9);
      animation: gateForumTravel 4.6s linear infinite;
    }
    @keyframes gateForumNodePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    @keyframes gateForumTravel {
      0% { transform: translate(-32vw, -18vh); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translate(0vw, 0vh); opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(32vw, 18vh); opacity: 0; }
    }
  </style>
</head>
<body class="gate-page">
  <div id="acadbeatNav"></div>
  <a class="gate-home-link" href="./home.html?entry=1" title="Back to AcadBeat home">AcadBeat Home</a>
  <main class="gate-main gate-main--clickable" onclick="enterPage()" onkeydown="enterByKey(event)" tabindex="0">
    <div class="gate-fx gate-fx--forum" aria-hidden="true">
      <div class="forum-link" style="left:16%;top:34%;width:34%;transform:rotate(18deg)"></div>
      <div class="forum-link" style="left:48%;top:44%;width:30%;transform:rotate(-16deg)"></div>
      <div class="forum-link" style="left:20%;top:64%;width:44%;transform:rotate(-8deg)"></div>
      <div class="forum-link" style="left:56%;top:64%;width:24%;transform:rotate(22deg)"></div>
      <div class="forum-node" style="left:16%;top:34%;animation-delay:-0.3s"></div>
      <div class="forum-node" style="left:48%;top:44%;animation-delay:-1.1s"></div>
      <div class="forum-node" style="left:78%;top:36%;animation-delay:-0.8s"></div>
      <div class="forum-node" style="left:20%;top:64%;animation-delay:-1.6s"></div>
      <div class="forum-node" style="left:56%;top:64%;animation-delay:-2.2s"></div>
      <div class="forum-node" style="left:80%;top:72%;animation-delay:-1.9s"></div>
      <div class="forum-pulse" style="left:50%;top:50%;animation-delay:-0.2s"></div>
      <div class="forum-pulse" style="left:50%;top:50%;animation-delay:-2.2s"></div>
    </div>
    <div class="gate-hero">
      <h1 class="gate-title">Forum</h1>
      <div class="gate-typing" aria-hidden="true">
        <div class="gate-typing-track">
          <span id="gateTypingDot" class="gate-typing-dot">🫀</span>
          <span id="gateTypingText"></span>
        </div>
      </div>
      <div class="gate-actions">
        <button type="button" class="gate-enter-btn" onclick="enterPage(); event.stopPropagation();">Enter Module</button>
      </div>
    </div>
  </main>
  <script src="./shared-nav.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: './',
        active: 'forum',
        academicUrl: './academic-gate.html',
        forumUrl: './forum-gate.html',
        technologyUrl: './technology-gate.html',
        studioUrl: './studio-gate.html',
        competitionUrl: './competition-gate.html',
        authApiBase: './Auth/backend/api',
        homeUrl: './home.html',
        ownerUrl: './owner.html',
        adminUrl: (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || window.location.origin + '/admin_page/dist/index.html',
        redirectAdmins: true
      });
      initGateTyping();
    });
    function initGateTyping() {
      const phrase = 'Communicate your ideas with confidence.';
      const textMount = document.getElementById('gateTypingText');
      const dot = document.getElementById('gateTypingDot');
      if (!textMount || !dot) return;
      textMount.innerHTML = '';
      const chars = Array.from(phrase).map((ch) => {
        const span = document.createElement('span');
        span.className = 'gate-typing-char';
        span.textContent = ch;
        textMount.appendChild(span);
        return span;
      });
      function setDot(index) {
        if (!chars.length) return;
        const safe = Math.max(0, Math.min(index, chars.length - 1));
        dot.style.left = `${chars[safe].offsetLeft - 16}px`;
      }
      function clearLine() {
        chars.forEach((el) => el.classList.remove('is-on'));
        dot.style.left = '0px';
      }
      function loop() {
        clearLine();
        let i = 0;
        const timer = window.setInterval(() => {
          if (i < chars.length) {
            chars[i].classList.add('is-on');
            setDot(i);
            i += 1;
            return;
          }
          window.clearInterval(timer);
          window.setTimeout(loop, 1000);
        }, 65);
      }
      loop();
    }
    function enterPage() {
      const L = window.ACADBEAT_LOCAL || {};
      window.location.href = L.forumDevChooserUrl || (window.location.origin + '/forum-project/dist/index.html?view=forum');
    }
    function enterByKey(event) { if (event.key === 'Enter' || event.key === ' ') enterPage(); }
  </script>
</body>
</html>
