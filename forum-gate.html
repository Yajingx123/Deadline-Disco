<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum</title>
  <link rel="stylesheet" href="./shared-nav.css">
  <script src="./shared/acadbeat-local-config.js"></script>
  <style>
    :root { --primary:#facc15; --secondary:#5b2a86; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 14%, rgba(250, 204, 21, 0.22), transparent 34%),
        radial-gradient(circle at 86% 84%, rgba(91, 42, 134, 0.24), transparent 36%),
        linear-gradient(146deg, #f8f4ff 0%, #eee3ff 56%, #fff7dd 100%);
    }
    .gate-main {
      margin-top: 80px;
      min-height: calc(100vh - 80px);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .node {
      position: absolute;
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(91, 42, 134, 0.84);
      box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.12);
      animation: nodePulse 2.2s ease-in-out infinite;
    }
    .link {
      position: absolute;
      height: 2px;
      transform-origin: left center;
      background: linear-gradient(90deg, rgba(91, 42, 134, 0.12), rgba(91, 42, 134, 0.58), rgba(91, 42, 134, 0.12));
    }
    .pulse {
      position: absolute;
      width: 16px; height: 16px; border-radius: 50%;
      background: rgba(250, 204, 21, 0.9);
      animation: travel 4.6s linear infinite;
    }
    h1 {
      position: relative; z-index: 3;
      font-family: "Playfair Display", serif;
      font-size: clamp(3rem, 9vw, 7rem);
      letter-spacing: -0.03em;
      color: var(--secondary);
      text-shadow: 0 14px 44px rgba(91, 42, 134, 0.25);
    }
    .gate-enter-btn {
      position: relative; z-index: 3; margin-top: 22px;
      min-height: 52px; padding: 0 28px;
      border: 1px solid rgba(250, 204, 21, 0.85);
      border-radius: 999px;
      background: linear-gradient(135deg, #facc15 0%, #ffd84a 100%);
      color: #5b2a86;
      font-size: 0.84rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800;
      cursor: pointer; box-shadow: 0 18px 40px rgba(250, 204, 21, 0.28);
    }
    .gate-enter-btn:hover { transform: translateY(-2px) scale(1.02); }
    @keyframes nodePulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.25);} }
    @keyframes travel {
      0% { transform: translate(-32vw, -18vh); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translate(0vw, 0vh); opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(32vw, 18vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="acadbeatNav"></div>
  <main class="gate-main" onclick="enterPage()" onkeydown="enterByKey(event)" tabindex="0">
    <div class="link" style="left:16%;top:34%;width:34%;transform:rotate(18deg)"></div>
    <div class="link" style="left:48%;top:44%;width:30%;transform:rotate(-16deg)"></div>
    <div class="link" style="left:20%;top:64%;width:44%;transform:rotate(-8deg)"></div>
    <div class="link" style="left:56%;top:64%;width:24%;transform:rotate(22deg)"></div>
    <div class="node" style="left:16%;top:34%;animation-delay:-0.3s"></div>
    <div class="node" style="left:48%;top:44%;animation-delay:-1.1s"></div>
    <div class="node" style="left:78%;top:36%;animation-delay:-0.8s"></div>
    <div class="node" style="left:20%;top:64%;animation-delay:-1.6s"></div>
    <div class="node" style="left:56%;top:64%;animation-delay:-2.2s"></div>
    <div class="node" style="left:80%;top:72%;animation-delay:-1.9s"></div>
    <div class="pulse" style="left:50%;top:50%;animation-delay:-0.2s"></div>
    <div class="pulse" style="left:50%;top:50%;animation-delay:-2.2s"></div>
    <h1>Forum</h1>
    <button class="gate-enter-btn" onclick="enterPage();event.stopPropagation();">Enter Module</button>
  </main>
  <script src="./shared-nav.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: './',
        active: 'forum',
        academicUrl: './academic-gate.html',
        forumUrl: './forum-gate.html',
        technologyUrl: './technology-gate.html',
        studioUrl: './studio-gate.html',
        rankUrl: './rank-gate.html',
        authApiBase: './Auth/backend/api',
        homeUrl: './home.html',
        ownerUrl: './owner.html',
        adminUrl: (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || window.location.origin + '/admin_page/dist/index.html',
        redirectAdmins: true
      });
    });
    function enterPage() {
      const L = window.ACADBEAT_LOCAL || {};
      window.location.href = L.forumDevChooserUrl || (window.location.origin + '/forum-project/dist/index.html?view=forum');
    }
    function enterByKey(event) { if (event.key === 'Enter' || event.key === ' ') enterPage(); }
  </script>
</body>
</html>
