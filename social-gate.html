<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social</title>
  <link rel="stylesheet" href="./shared-nav.css">
  <link rel="stylesheet" href="./shared-gate.css">
  <script src="./shared/acadbeat-local-config.js"></script>
  <style>
    /* Social-only: expanding ripple halos */
    .gate-fx--social .social-halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24vmin;
      height: 24vmin;
      margin-left: -12vmin;
      margin-top: -12vmin;
      border-radius: 50%;
      border: 2px solid rgba(91, 42, 134, 0.26);
      animation: gateSocialRipple 3.4s ease-out infinite;
      pointer-events: none;
    }
    .gate-fx--social .social-halo.h2 { animation-delay: 1.1s; }
    .gate-fx--social .social-halo.h3 { animation-delay: 2.2s; }
    @keyframes gateSocialRipple {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(5.8); opacity: 0; }
    }
  </style>
</head>
<body class="gate-page">
  <div id="acadbeatNav"></div>
  <main class="gate-main gate-main--clickable" onclick="enterPage()" onkeydown="enterByKey(event)" tabindex="0">
    <div class="gate-fx gate-fx--social" aria-hidden="true">
      <div class="social-halo h1"></div>
      <div class="social-halo h2"></div>
      <div class="social-halo h3"></div>
    </div>
    <div class="gate-hero">
      <h1 class="gate-title">Social</h1>
      <div class="gate-typing" aria-hidden="true">
        <div class="gate-typing-track">
          <span id="gateTypingDot" class="gate-typing-dot">🫀</span>
          <span id="gateTypingText"></span>
        </div>
      </div>
      <div class="gate-actions">
        <button type="button" class="gate-enter-btn" onclick="enterPage(); event.stopPropagation();">Enter Module</button>
      </div>
    </div>
  </main>
  <script src="./shared-nav.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: './',
        active: 'social',
        academicUrl: './academic-gate.html',
        forumUrl: './forum-gate.html',
        technologyUrl: './technology-gate.html',
        studioUrl: './studio-gate.html',
        socialUrl: './social-gate.html',
        competitionUrl: './competition-gate.html',
        authApiBase: './Auth/backend/api',
        homeUrl: './home.html',
        ownerUrl: './owner.html',
        adminUrl: (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || window.location.origin + '/admin_page/dist/index.html',
        redirectAdmins: true
      });
      initGateTyping();
    });

    function initGateTyping() {
      const phrase = 'Private chat, add friends, and group conversations in one place.';
      const textMount = document.getElementById('gateTypingText');
      const dot = document.getElementById('gateTypingDot');
      if (!textMount || !dot) return;
      textMount.innerHTML = '';
      const chars = Array.from(phrase).map((ch) => {
        const span = document.createElement('span');
        span.className = 'gate-typing-char';
        span.textContent = ch;
        textMount.appendChild(span);
        return span;
      });

      function setDot(index) {
        if (!chars.length) return;
        const safe = Math.max(0, Math.min(index, chars.length - 1));
        dot.style.left = `${chars[safe].offsetLeft - 16}px`;
      }
      function clearLine() {
        chars.forEach((el) => el.classList.remove('is-on'));
        dot.style.left = '0px';
      }
      function loop() {
        clearLine();
        let i = 0;
        const timer = window.setInterval(() => {
          if (i < chars.length) {
            chars[i].classList.add('is-on');
            setDot(i);
            i += 1;
            return;
          }
          window.clearInterval(timer);
          window.setTimeout(loop, 1000);
        }, 65);
      }
      loop();
    }

    function buildMessageCenterUrl() {
      const base =
        (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.messageCenterDistUrl) ||
        (window.location.origin + '/message-center-project/dist/index.html');
      const current = new URL(window.location.href);
      current.searchParams.delete('login');
      const target = new URL(base, window.location.origin);
      target.searchParams.set('from', current.toString());
      return target.toString();
    }

    function enterPage() {
      window.location.href = buildMessageCenterUrl();
    }
    function enterByKey(event) {
      if (event.key === 'Enter' || event.key === ' ') enterPage();
    }
  </script>
</body>
</html>
