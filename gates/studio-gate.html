<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio</title>
  <link rel="stylesheet" href="./shared-nav.css">
  <link rel="stylesheet" href="./shared-gate.css">
  <script src="../shared/acadbeat-local-config.js"></script>
  <style>
    /* Studio-only: concentric spinning rings */
    .gate-fx--studio .studio-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(91, 42, 134, 0.25);
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .gate-fx--studio .studio-ring.r1 { width: 120vmin; height: 120vmin; animation: gateStudioSpin 18s linear infinite; }
    .gate-fx--studio .studio-ring.r2 { width: 86vmin; height: 86vmin; animation: gateStudioSpin 12s linear infinite reverse; }
    .gate-fx--studio .studio-ring.r3 {
      width: 56vmin;
      height: 56vmin;
      animation: gateStudioPulse 2.8s ease-in-out infinite;
      border-color: rgba(250, 204, 21, 0.52);
    }
    @keyframes gateStudioSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes gateStudioPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body class="gate-page">
  <div id="acadbeatNav"></div>
  <a class="gate-home-link" href="../home.html?entry=1" title="Back to AcadBeat home">AcadBeat Home</a>
  <main class="gate-main gate-main--clickable" onclick="enterPage()" onkeydown="enterByKey(event)" tabindex="0">
    <div class="gate-fx gate-fx--studio" aria-hidden="true">
      <div class="studio-ring r1"></div>
      <div class="studio-ring r2"></div>
      <div class="studio-ring r3"></div>
    </div>
    <div class="gate-hero">
      <h1 class="gate-title">Studio</h1>
      <div class="gate-typing" aria-hidden="true">
        <div class="gate-typing-track">
          <span id="gateTypingDot" class="gate-typing-dot">🫀</span>
          <span id="gateTypingText"></span>
        </div>
      </div>
      <div class="gate-actions">
        <button type="button" class="gate-enter-btn" onclick="enterPage(); event.stopPropagation();">Enter Module</button>
      </div>
    </div>
  </main>
  <script src="./shared-nav.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: '../',
        active: 'studio',
        academicUrl: './academic-gate.html',
        forumUrl: './forum-gate.html',
        technologyUrl: './technology-gate.html',
        studioUrl: './studio-gate.html',
        competitionUrl: './competition-gate.html',
        authApiBase: '../Auth/backend/api',
        homeUrl: '../home.html',
        ownerUrl: '../owner.html',
        adminUrl: (window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.adminDistUrl) || window.location.origin + '/admin_page/dist/index.html',
        redirectAdmins: true
      });
      initGateTyping();
    });
    function initGateTyping() {
      const phrase = 'Build creative projects and turn ideas into real experiences.';
      const textMount = document.getElementById('gateTypingText');
      const dot = document.getElementById('gateTypingDot');
      if (!textMount || !dot) return;
      textMount.innerHTML = '';
      const chars = Array.from(phrase).map((ch) => {
        const span = document.createElement('span');
        span.className = 'gate-typing-char';
        span.textContent = ch;
        textMount.appendChild(span);
        return span;
      });
      function setDot(index) {
        if (!chars.length) return;
        const safe = Math.max(0, Math.min(index, chars.length - 1));
        dot.style.left = `${chars[safe].offsetLeft - 16}px`;
      }
      function clearLine() {
        chars.forEach((el) => el.classList.remove('is-on'));
        dot.style.left = '0px';
      }
      function loop() {
        clearLine();
        let i = 0;
        const timer = window.setInterval(() => {
          if (i < chars.length) {
            chars[i].classList.add('is-on');
            setDot(i);
            i += 1;
            return;
          }
          window.clearInterval(timer);
          window.setTimeout(loop, 1000);
        }, 65);
      }
      loop();
    }
    function enterPage() { window.location.href = '../Studio/studio.html'; }
    function enterByKey(event) {
      if (event.key === 'Enter' || event.key === ' ') enterPage();
    }
  </script>
</body>
</html>
