<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Detail | AcadBeat (Custom UI)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../gates/shared-nav.css">
  <script src="../shared/acadbeat-local-config.js"></script>
  <link rel="stylesheet" href="acadbeat-global.css">
  <link rel="stylesheet" href="practice-style.css">

  <style>
    /* ---------------- 全局基础重置与背景 ---------------- */
    body[data-page="video-detail"] {
        margin: 0;
        padding: 0;
        background-image: url('note-background.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: 'Comic Sans MS', 'Inter', sans-serif;
        color: white;
    }

    /* 黑魔法：消除黑底提取白字，并变色叠加 */
    .blend-magic {
        filter: invert(1);
        mix-blend-mode: multiply;
    }

    /* ---------------- 整体布局容器 ---------------- */
    .custom-container {
        display: flex;
        gap: 40px;
        width: 95vw;
        max-width: 1400px;
        height: 85vh; /* 留出顶部导航栏的空间 */
        margin: 0 auto;
        align-items: stretch;
        padding: 20px;
        box-sizing: border-box;
    }

    /* ================= 左侧：视频与字幕区域 ================= */
    .left-panel {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        gap: 15px;
        position: relative;
    }

    .workspace-top-actions {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    /* 视频框架 */
    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 11;
    }

    .video-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('note-video-frame.png') no-repeat center center;
        background-size: contain;
        z-index: 2;
        pointer-events: none; /* 穿透框架点击内部视频 */
    }

    .video-content {
        position: absolute;
        top: 8%;
        left: 5%;
        width: 90%;
        height: 82%;
        z-index: 1;
        background-color: #000;
        border-radius: 15px;
        overflow: hidden;
    }

    /* 真实的视频元素 */
    #practiceVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        outline: none;
    }

    /* 字幕区域 */
    .transcript-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .detail-resource-tabs { margin-bottom: 5px; }
    
    #transcriptPanel {
        border: 2px solid white;
        border-radius: 10px;
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background: rgba(0,0,0,0.5); /* 提升文字可读性 */
    }

    /* ================= 右侧：剪贴板笔记区域 ================= */
    .right-panel {
        flex: 1;
        position: relative;
        display: flex;
        justify-content: center;
    }

    .clipboard {
        position: relative;
        width: 100%;
        max-width: 600px;
        height: 100%;
        background: url('note-clipboard.png') no-repeat top center;
        background-size: contain;
    }

    .notes-content {
        position: absolute;
        top: 12%;
        left: 10%;
        width: 80%;
        height: 78%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Share 按钮 (使用 1.jpg) */
    #noteShareBtn {
        position: absolute;
        top: 8%;
        right: 5%;
        width: 80px;
        height: 40px;
        background: url('1.jpg') no-repeat center center;
        background-size: cover;
        cursor: pointer;
        border: none;
        color: transparent; /* 隐藏原生文字，完全使用图片 */
        z-index: 10;
    }

    .sprite-bg {
        background-image: url('2.jpg');
        background-repeat: no-repeat;
        width: 100%;
    }

    .note-item {
        display: flex;
        flex-direction: column;
        flex: 1;
        position: relative;
    }

    .note-title {
        height: 30px;
        width: 150px;
        background-size: 300%;
    }
    .title-main { background-position: 80% 8%; }
    .title-key { background-position: 78% 28%; }
    .title-view { background-position: 82% 48%; }

    /* 真实的输入框包裹器 */
    .textarea-wrapper {
        position: relative;
        flex: 1;
        width: 100%;
        min-height: 80px;
    }

    /* 边框背景层 */
    .note-box-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-size: 250%;
        background-position: 5% 20%;
        opacity: 0.7;
        pointer-events: none; /* 让鼠标穿透背景直接点击 textarea */
        z-index: 1;
    }

    /* 透明输入框 */
    .textarea-wrapper textarea {
        position: absolute;
        top: 10px; left: 10px;
        width: calc(100% - 20px);
        height: calc(100% - 20px);
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        font-family: inherit;
        font-size: 15px;
        color: #333; /* 在白底上显示深灰色文字 */
        z-index: 2;
    }
    .textarea-wrapper textarea::placeholder { color: rgba(0,0,0,0.3); }

    /* Record 按钮 */
    .record-action-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: auto;
    }

    #recordAnswerBtn {
        width: 100%;
        height: 60px;
        background-color: transparent;
        border: none;
        color: transparent; /* 隐藏原生文字 */
        cursor: pointer;
        background-size: 150%;
        background-position: 80% 68%;
    }

    /* 隐藏类辅助 */
    .hidden { display: none !important; }
    
    /* 弱化状态反馈文字 */
    #recordAnswerError, #recordAnswerFeedback {
        color: #333;
        font-size: 12px;
        text-align: center;
        margin-top: 5px;
    }
  </style>
</head>
<body data-page="video-detail">
  <div id="acadbeatNav"></div>

  <main class="module-content page-shell" style="padding-top: 110px;">
    
    <div class="custom-container" id="studyWorkspace">
      
      <div class="left-panel">
        
        <div class="workspace-top-actions">
          <button class="back-btn back-fab" data-back-target="listening.html" aria-label="Go back" title="Back" type="button" style="background: transparent; border: 2px solid white; color: white; width: 40px; height: 40px; border-radius: 8px;">&#8592;</button>
          <div>
            <h2 id="detailTitle" style="margin:0; font-size: 20px;">Video title</h2>
            <p id="detailPersonMeta" class="person-meta-line" style="margin: 5px 0 0 0; font-size: 14px; opacity: 0.8;"></p>
          </div>
        </div>
        <div id="detailMeta" class="detail-meta-row" style="font-size: 12px; opacity: 0.6;"></div>

        <div class="video-wrapper">
          <div class="video-content">
            <video id="practiceVideo" controls preload="metadata"></video>
          </div>
          <div class="video-frame"></div>
        </div>

        <div class="transcript-wrapper">
          <div class="detail-resource-tabs">
            <button class="btn-small transcript-toggle-btn detail-resource-tab" id="transcriptToggleBtn" type="button" style="background: transparent; border: 1px solid white; color: white; padding: 5px 15px; border-radius: 5px;">Transcript</button>
            <button class="btn-small transcript-toggle-btn detail-resource-tab hidden" id="sampleNotesToggleBtn" type="button">Sample Notes</button>
          </div>
          <aside class="transcript-panel hidden" id="transcriptPanel">
            <div class="detail-resource-head">
              <strong id="detailResourceTitle">Transcript</strong>
            </div>
            <div class="transcript-content" id="transcriptContent"></div>
          </aside>
        </div>
      </div>

      <div class="right-panel">
        <div class="clipboard">
          
          <button id="noteShareBtn" class="blend-magic" type="button">Share</button>

          <div class="notes-content form-area">
            
            <div class="note-item">
              <div class="note-title sprite-bg blend-magic title-main"></div>
              <div class="textarea-wrapper">
                <div class="note-box-bg sprite-bg blend-magic"></div>
                <textarea id="noteMainContent" placeholder="Summarize the main content..."></textarea>
                <div class="note-field-display hidden" id="noteMainContentDisplay"></div>
              </div>
            </div>

            <div class="note-item">
              <div class="note-title sprite-bg blend-magic title-key"></div>
              <div class="textarea-wrapper">
                <div class="note-box-bg sprite-bg blend-magic"></div>
                <textarea id="noteKeyWord" placeholder="Record keywords and terms..."></textarea>
                <div class="note-field-display hidden" id="noteKeyWordDisplay"></div>
              </div>
            </div>

            <div class="note-item">
              <div class="note-title sprite-bg blend-magic title-view"></div>
              <div class="textarea-wrapper">
                <div class="note-box-bg sprite-bg blend-magic"></div>
                <textarea id="notePersonalView" placeholder="Write your thoughts..."></textarea>
                <div class="note-field-display hidden" id="notePersonalViewDisplay"></div>
              </div>
            </div>

            <div class="record-action-area">
              <button id="recordAnswerBtn" class="sprite-bg blend-magic" type="button">Record your answer</button>
              
              <span class="note-record-error hidden" id="recordAnswerError">notes are blank</span>
              <div class="note-record-feedback hidden" id="recordAnswerFeedback">
                <strong>Saved to your study record</strong><br>
                <span>You can still make multiple attempts and save</span>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="practice-data.js"></script>
  <script src="practice-data-api.js"></script>
  <script src="practice-app-api.js"></script>
  <script>
    window.addEventListener('load', () => {
      const L = window.ACADBEAT_LOCAL || {};
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: '../',
        active: 'academic',
        authApiBase: '../Auth/backend/api',
        homeUrl: '../home.html',
        ownerUrl: '../owner.html',
        adminUrl: L.adminDistUrl || window.location.origin + '/admin_page/dist/index.html',
        loginUrl: '../home.html?login=1',
        redirectAdmins: false
      });
    });
  </script>
  <script src="../gates/shared-nav.js"></script>
</body>
</html>
