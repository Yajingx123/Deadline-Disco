<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Response Practice | AcadBeat</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="../shared/acadbeat-local-config.js"></script>
  <style>
    @font-face {
      font-family: "AcademicDisplay";
      src: url("Myfont-Regular.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --monitor-ratio: 1452 / 1071;
      --text-main: #ffffff;
      --accent-cyan: #7ef5de;
      --font-ui: "AcademicDisplay", sans-serif;
      --font-pixel: "Press Start 2P", cursive;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: clamp(20px, 4vh, 60px) 20px;
      font-family: var(--font-ui);
      background:
        linear-gradient(180deg, rgba(18, 13, 14, 0.36), rgba(18, 13, 14, 0.64)),
        url("note_training/note-background.png") center center / cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      color: var(--text-main);
      overflow-x: hidden;
    }

    .page-shell {
      width: min(1680px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(380px, 30vw, 520px);
      gap: 30px;
      align-items: start;
    }

    /* --- 左侧：卡通显示器 (视频区) --- */
    .monitor-panel {
      width: 100%;
      aspect-ratio: var(--monitor-ratio);
      background: url("note_training/note-video-frame.png") no-repeat center center;
      background-size: 100% 100%;
      position: relative;
      filter: drop-shadow(0 20px 50px rgba(0,0,0,0.4));
    }

    .monitor-screen {
      position: absolute;
      top: 12%; left: 2.7%;
      width: 94.6%; height: 80.4%;
      background: #1a1617;
      border-radius: clamp(12px, 1.5vw, 22px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .monitor-header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 2px dashed rgba(255, 255, 255, 0.1);
    }

    .monitor-header h2 {
      margin: 0;
      font-family: var(--font-pixel) !important;
      font-size: 16px;
      color: var(--text-main);
      text-shadow: 2px 2px 0px #000;
    }

    .monitor-header .exit-link {
      background: none; border: none; color: #fff; cursor: pointer;
      font-family: var(--font-pixel); font-size: 10px; text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .workspace-top-actions {
      padding: 18px 26px 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-fab {
      width: 42px;
      height: 42px;
      border: 2px solid rgba(255, 255, 255, 0.74);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .workspace-top-actions h2 {
      margin: 0;
      font-family: var(--font-pixel) !important;
      font-size: clamp(15px, 1.5vw, 22px);
      line-height: 1.25;
      color: var(--text-main);
      letter-spacing: 0.02em;
    }

    .person-meta-line {
      margin: 10px 26px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: rgba(255,255,255,0.84);
      font-size: 0.94rem;
      min-height: 1.2em;
    }

    .person-meta-separator {
      opacity: 0.62;
    }

    .country-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .country-flag-icon {
      width: 18px;
      height: 13px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, 0.75);
    }

    .detail-meta-row {
      margin: 12px 26px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 32px;
    }

    .detail-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 12px;
      border: 2px solid rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    #respondVideo {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: contain;
      background: #000;
    }

    .detail-resource-tabs {
      margin: 10px 26px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .detail-resource-tab {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.82);
      background: rgba(0,0,0,0.32);
      color: #fff;
      cursor: pointer;
      font-size: 0.86rem;
      font-family: var(--font-ui);
      font-weight: 700;
    }

    .detail-resource-tab.is-active,
    .detail-resource-tab:hover {
      background: rgba(255,255,255,0.16);
    }

    .transcript-panel {
      margin: 12px 26px 16px;
      padding: 12px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.78);
      background: rgba(0,0,0,0.35);
      max-height: 200px;
      overflow: auto;
    }

    .detail-resource-head {
      margin-bottom: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }

    .transcript-content {
      white-space: pre-wrap;
      font-size: 0.92rem;
      line-height: 1.55;
      color: rgba(255,255,255,0.9);
    }

    /* --- 右侧：录音控制台 (替换原画板) --- */
    .control-console {
      background: rgba(44, 33, 24, 0.65);
      backdrop-filter: blur(12px);
      border: 4px solid #fff;
      border-radius: 32px;
      padding: 40px 30px;
      margin-top: 88px;
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.3),
        inset 0 0 0 2px rgba(126, 245, 222, 0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* 状态呼吸灯 */
    .console-led {
      position: absolute;
      top: 24px; right: 30px;
      width: 14px; height: 14px;
      background: #ff5252;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff5252;
      animation: blink 1.2s infinite ease-in-out;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .console-title {
      font-family: var(--font-pixel) !important;
      font-size: 14px;
      color: var(--accent-cyan);
      text-align: center;
      margin-bottom: 5px;
    }

    .respond-hint {
      font-size: 0.95rem;
      line-height: 1.6;
      color: rgba(255,255,255,0.75);
      text-align: center;
      margin-bottom: 10px;
    }

    /* 录音按钮：巨大的卡通按钮设计 */
    .record-btn-wrap {
      display: flex;
      justify-content: center;
      padding: 15px 0;
    }

    .cartoon-record-btn {
      width: 150px; height: 150px;
      background: var(--accent-cyan);
      border: 6px solid #2c2118;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 0px #2c2118;
      outline: none;
    }

    .cartoon-record-btn:hover { transform: scale(1.04); }
    .cartoon-record-btn:active { transform: translateY(8px); box-shadow: 0 2px 0px #2c2118; }
    
    /* 录音状态文字 */
    .cartoon-record-btn span {
      font-family: var(--font-pixel) !important;
      font-size: 11px;
      color: #2c2118;
      font-weight: 800;
    }

    .status-monitor {
      text-align: center;
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--accent-cyan);
      background: rgba(0,0,0,0.3);
      padding: 8px;
      border-radius: 8px;
    }

    /* 播放器适配 */
    audio {
      width: 100%;
      filter: invert(1) hue-rotate(180deg) contrast(1.2);
    }

    .upload-btn {
      width: min(280px, 92%);
      height: 52px;
      background: #ff8a80;
      border: 4px solid #2c2118;
      border-radius: 14px;
      color: #fff;
      font-family: var(--font-pixel) !important;
      font-size: 11px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 6px 0px #2c2118;
      transition: all 0.1s;
    }

    .upload-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px #2c2118; }

    .action-btn-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .feedback-msg {
      text-align: center;
      color: var(--accent-cyan);
      font-weight: 800;
      font-size: 0.9rem;
      padding-top: 10px;
    }

    @media (max-width: 1180px) {
      .page-shell { grid-template-columns: 1fr; }
      .control-console { max-width: 500px; margin: 0 auto; }
    }
  </style>
</head>
<body data-page="response-detail">

  <main class="page-shell">
    <section class="monitor-panel">
      <div class="monitor-screen">
        <div class="workspace-top-actions">
          <button class="back-btn back-fab" data-back-target="listening-2.html?mode=respond" aria-label="Go back" title="Back" type="button">&#8592;</button>
          <h2 id="respondTitle">SYSTEM_PLAYBACK</h2>
        </div>
        <p id="respondPersonMeta" class="person-meta-line"></p>
        <div id="respondMeta" class="detail-meta-row"></div>
        <video id="respondVideo" controls preload="metadata"></video>
        <div class="detail-resource-tabs">
          <button id="respondTranscriptToggleBtn" class="detail-resource-tab" type="button">Transcript</button>
        </div>
        <aside id="respondTranscriptPanel" class="transcript-panel hidden" aria-hidden="true">
          <div class="detail-resource-head">
            <strong id="respondResourceTitle">Transcript</strong>
          </div>
          <div id="respondTranscriptContent" class="transcript-content"></div>
        </aside>
      </div>
    </section>

    <aside class="control-console">
      <div class="console-led"></div>
      <h3 class="console-title">REC_MODULE_V2</h3>
      
      <p class="respond-hint">Record your answer and replay it to self-check fluency and clarity.</p>

      <div class="record-btn-wrap">
        <button class="cartoon-record-btn" id="respondRecordBtn">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="#2c2118"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          <span id="recordBtnLabel">START_REC</span>
        </button>
      </div>

      <div id="respondRecordStatus" class="status-monitor">MONITOR: READY_TO_LISTEN</div>

      <audio id="respondPlayback" controls></audio>

      <div class="action-btn-stack">
        <button class="upload-btn" id="respondSaveBtn">UPLOAD_TO_CLOUD</button>
        <button class="upload-btn" id="respondShareBtn" type="button">SHARE</button>
        <span id="respondSaveError" class="hidden" style="color:#ff8a80; font-size:12px; text-align:center;">Error: No Recording Detected</span>
      </div>

      <div id="respondSaveFeedback" class="feedback-msg hidden">
        DATA_SAVED: SUCCESSFUL
      </div>
    </aside>
  </main>

  <script src="practice-data-api.js"></script>
  <script src="practice-app-api.js"></script>
</body>
</html>
