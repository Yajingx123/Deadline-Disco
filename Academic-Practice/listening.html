<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Selection | AcadBeat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../gates/shared-nav.css">
  <script src="../shared/acadbeat-local-config.js"></script>
  <link rel="stylesheet" href="acadbeat-global.css">
  <link rel="stylesheet" href="practice-style.css">
</head>
<body data-page="video-list">
  <script>
    (function () {
      try {
        var m = new URLSearchParams(window.location.search).get("mode");
        var lm = m === "respond" ? "respond" : "understand";
        document.documentElement.dataset.listeningMode = lm;
        document.body.dataset.listeningMode = lm;
      } catch (_e) {}
    })();
  </script>
  <div id="acadbeatNav"></div>
  <main class="module-content page-shell">
    <section class="video-results compact-results">
      <div class="listening-layout-root">
        <div class="listening-below-header">
          <div class="listening-row-godot-main">
            <aside class="listening-slot listening-slot--mascot" aria-hidden="true">
              <div class="listening-art listening-art--mascot" data-ab-art="mascot"></div>
              <p class="listening-caption">choose your video</p>
            </aside>

            <div class="listening-godot-viewport">
            <div class="listening-godot-canvas">
            <div class="listening-godot-scaled-plate">
            <header class="listening-row-top compact-results-header">
              <div class="listening-slot listening-slot--exit">
                <button class="back-btn back-fab" data-back-target="training.html" aria-label="Go back" title="Back" type="button">&#8592;</button>
              </div>
              <div class="listening-slot listening-slot--heading">
                <h3 id="modeTitle">Self-training</h3>
                <p id="resultsCount">0 videos</p>
              </div>
              <div class="listening-slot listening-slot--top-spacer" aria-hidden="true"></div>
            </header>
            <div class="listening-main-stage">
              <div class="listening-center-area">
                <div class="listening-center-wrap">
                <div class="listening-square-stage">
                <div class="listening-frame-outer">
                  <div class="listening-frame-inner">
                    <div class="listening-tv-stack">
                      <div class="listening-tv-body">
                        <div class="listening-tv-screen">
                          <div class="results-scroll-region">
                            <div id="videoResultList" class="video-card-list"></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                </div>
                </div>
              </div>
              <div class="listening-right-rail">
                  <div class="listening-texture-cluster" aria-hidden="true">
                    <div class="listening-texture-cell" data-ab-art="tx-01"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-02"></div>
                    <div class="listening-texture-cell listening-texture-cell--wide" data-ab-art="tx-03"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-04"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-05"></div>
                    <div class="listening-texture-cell listening-texture-cell--tall" data-ab-art="tx-06"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-07"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-08"></div>
                    <div class="listening-texture-cell listening-texture-cell--wide" data-ab-art="tx-09"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-10"></div>
                    <div class="listening-texture-cell" data-ab-art="tx-11"></div>
                    <div class="listening-texture-cell listening-texture-cell--small" data-ab-art="tx-12"></div>
                  </div>
                  <aside class="listening-filter-dock" aria-label="Filters">
                    <div class="listening-filter-dock-frame">
                      <div class="listening-filter-dock-decor" aria-hidden="true">
                        <div class="listening-art listening-art--power" data-ab-art="dock-power"></div>
                        <div class="listening-filter-dock-leds">
                          <div class="listening-art listening-art--led" data-ab-art="dock-led-1"></div>
                          <div class="listening-art listening-art--led" data-ab-art="dock-led-2"></div>
                        </div>
                      </div>
                      <div class="listening-filter-dock-middle">
                        <div class="listening-filter-dock-scroll">
                          <div class="listening-filter-slot" data-filter="search">
                            <input id="smartSearch" class="smart-input compact-search" type="search" placeholder="Search videos...">
                          </div>
                          <div class="listening-filter-slot" data-filter="type">
                            <select id="smartType" class="smart-select compact-select"></select>
                          </div>
                          <div class="listening-filter-slot" data-filter="difficulty">
                            <select id="smartDifficulty" class="smart-select compact-select">
                              <option value="All">Difficulty: All</option>
                              <option value="Easy">Easy</option>
                              <option value="Medium">Medium</option>
                              <option value="Hard">Hard</option>
                            </select>
                          </div>
                          <div class="listening-filter-slot" data-filter="duration">
                            <select id="smartDuration" class="smart-select compact-select">
                              <option value="All">Duration: All</option>
                              <option value="0-1min">0-1min</option>
                              <option value="1-2min">1-2min</option>
                              <option value="2-3min">2-3min</option>
                            </select>
                          </div>
                          <div class="listening-filter-slot" data-filter="source">
                            <select id="smartSource" class="smart-select compact-select">
                              <option value="All">Source: All</option>
                              <option value="OpenLearn">OpenLearn</option>
                              <option value="ELLLO">ELLLO</option>
                            </select>
                          </div>
                        </div>
                        <div class="listening-filter-slot listening-filter-slot--country" data-filter="country">
                          <div id="smartCountryFilter" class="compact-select country-filter"></div>
                        </div>
                      </div>
                      <div class="listening-filter-reset-square">
                        <button id="clearSmartFilters" class="btn-small compact-reset-btn listening-filter-reset-btn" type="button">Reset</button>
                      </div>
                    </div>
                  </aside>
              </div>
            </div>
            </div>
            </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="practice-data-api.js"></script>
  <script src="practice-app-api.js"></script>
  <script>
    window.addEventListener('load', () => {
      const L = window.ACADBEAT_LOCAL || {};
      const loginUrl = '../home.html?login=1';
      window.initializeAcadBeatNav({
        mountId: 'acadbeatNav',
        basePath: '../',
        active: 'academic',
        authApiBase: '../Auth/backend/api',
        homeUrl: '../home.html',
        ownerUrl: '../owner.html',
        forumUrl: '../home.html?module=Dialogue',
        technologyUrl: '../Technology/technology.html',
        studioUrl: '../Studio/studio.html',
        messageCenterUrl: L.messageCenterDistUrl,
        adminUrl: L.adminDistUrl || window.location.origin + '/admin_page/dist/index.html',
        messageApiUrl: L.messageSummaryApiUrl,
        loginUrl,
        redirectAdmins: false,
        showChallengeButton: false
      });
    });
  </script>
  <script src="../gates/shared-nav.js"></script>
</body>
</html>
