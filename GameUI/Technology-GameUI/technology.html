<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcadBeat | Technology Toolkits</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="/shared/acadbeat-local-config.js"></script>
    <script src="/Technology/shared/page-guards.js"></script>
    <style>html.acadbeat-role-guard body{visibility:hidden}</style>
    <script>
        window.acadbeatGuardAdminPage({
            authMeUrl: '/Auth/backend/api/me.php',
            guardClass: 'acadbeat-role-guard',
            redirectAdmin: true,
        });
    </script>
    <style>
        :root {
            --primary-color: #9BB7D4;
            --secondary-color: #3A4E6B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            background-image: url('./image/technology-toolkit-background.png');
            background-size: auto 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .godot-back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 999;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .godot-back-btn:hover {
            transform: translateY(-1px);
            background: rgba(0, 0, 0, 0.82);
        }

        .page-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
            /* No top padding is needed here because this layout has no nav bar. */
        }

        .left-spacer {
            width: 50%;
            flex-shrink: 0;
        }

        .right-content {
            width: 50%;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 5vh 5vw 48px 0;
        }

        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2vw;
            width: 100%;
            max-width: min(85%, 65vh);
        }

        .box-item {
            display: block;
            width: 100%;
            aspect-ratio: 280 / 250; 
            position: relative;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            container-type: inline-size; 
        }

        .box-item:hover {
            transform: translateY(-5%);
        }

        .box-item img.box-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        @media (max-width: 1100px) {
            .page-layout {
                flex-direction: column;
            }

            .left-spacer,
            .right-content {
                width: 100%;
            }

            .left-spacer {
                display: none;
            }

            .right-content {
                padding: 24px 16px 36px;
                justify-content: center;
            }

            .boxes-grid {
                max-width: 860px;
                gap: 18px;
            }
        }

        @media (max-width: 700px) {
            .boxes-grid {
                grid-template-columns: 1fr;
            }

            .box-item {
                aspect-ratio: 300 / 210;
            }
        }

    </style>
</head>
<body>
    <button id="godotBackBtn" class="godot-back-btn" type="button" aria-label="Return to Godot">← Return to Godot</button>
    <div class="page-layout">
        <div class="left-spacer"></div>

        <div class="right-content">
            <div class="boxes-grid">
                
                    <a href="./dundee.html?from=technology1" class="box-item" title="Dundee Student Hub">
                        <img src="./image/dundee-student-hub.png" class="box-bg" alt="Dundee Student Hub">
                    </a>

                    <a href="https://support.microsoft.com/en-us/teams" target="_blank" class="box-item">
                        <img src="./image/microsoft-teams.png" class="box-bg" alt="Microsoft Teams">
                    </a>

                    <a href="https://docs.github.com/en/get-started" target="_blank" class="box-item">
                        <img src="./image/github.png" class="box-bg" alt="GitHub">
                    </a>

                    <a href="https://help.autodesk.com/view/ACD/2024/ENU/" target="_blank" class="box-item">
                        <img src="./image/autocad.png" class="box-bg" alt="AutoCAD">
                    </a>

                    <a href="https://matlabacademy.mathworks.com/" target="_blank" class="box-item">
                        <img src="./image/matlab.png" class="box-bg" alt="MATLAB">
                    </a>

                    <a href="https://www.originlab.com/index.aspx?go=Support/VideoTutorials" target="_blank" class="box-item">
                        <img src="./image/originlab.png" class="box-bg" alt="OriginLab">
                    </a>
            </div>
        </div>
    </div>
    <script>
        (function setupGodotBackButton() {
            const backBtn = document.getElementById('godotBackBtn');
            if (!backBtn) return;

            const fallbackGodotUrl =
                ((window.ACADBEAT_LOCAL && window.ACADBEAT_LOCAL.godotUrl) || '').trim() ||
                (window.location.origin + '/gameUI_src/Release/index.html');

            backBtn.addEventListener('click', function onBackToGodot() {
                if (window.opener && !window.opener.closed) {
                    try { window.opener.focus(); } catch (_e) {}
                    window.close();
                    setTimeout(function () {
                        if (!document.hidden) window.location.href = fallbackGodotUrl;
                    }, 250);
                    return;
                }

                if (document.referrer) {
                    window.location.href = document.referrer;
                    return;
                }

                window.location.href = fallbackGodotUrl;
            });
        })();
    </script>
</body>
</html>
