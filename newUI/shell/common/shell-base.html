<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shell 模板 | AcadBeat newUI</title>
  <link rel="stylesheet" href="../../static/shell-frame.css">
  <!-- 复制本文件到某模块后，增加 overrides.css，并在 body 上设置 data-ab-module -->
</head>
<body class="ab-shell" data-ab-module="common">
  <div class="ab-shell-viewport">
    <div class="ab-shell-underlay" aria-hidden="true">
      <!-- 可选：放一张整页底图，设 src 即可与 CSS 变量二选一 -->
      <img class="ab-shell-bg-fallback" src="" alt="">
    </div>
    <main class="ab-shell-main">
      <iframe class="ab-shell-iframe" id="abLegacyFrame" title="AcadBeat 内容"></iframe>
    </main>
    <div class="ab-shell-frame" aria-hidden="true"></div>
    <div class="ab-shell-overlay" aria-hidden="true"></div>
  </div>
  <script src="../../../shared/acadbeat-local-config.js"></script>
  <script src="../../static/shell-iframe.js"></script>
</body>
</html>
