<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Practice | AcadBeat</title>
  <link rel="stylesheet" href="overrides.css">
</head>
<body class="ab-shell ab-shell--vocabulary" data-ab-module="vocabulary">
  <main class="vocab-game-home" aria-label="Vocabulary practice mode selection">
    <h1 class="vocab-title">Vocabulary practice</h1>
    <section class="vocab-card-grid" aria-label="Practice duration options">
      <button class="vocab-mode-card" type="button" aria-label="1 minute fast review">
        <span class="vocab-mode-time">1min</span>
        <span class="vocab-mode-label">fast review</span>
      </button>
      <button class="vocab-mode-card" type="button" aria-label="3 to 5 minutes core review">
        <span class="vocab-mode-time">3-5minutes</span>
        <span class="vocab-mode-label">core review</span>
      </button>
      <button class="vocab-mode-card" type="button" aria-label="10 minutes full mix">
        <span class="vocab-mode-time">10 minutes</span>
        <span class="vocab-mode-label">full mix</span>
      </button>
    </section>
  </main>
</body>
</html>
